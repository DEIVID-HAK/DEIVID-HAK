name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: generate snake graphs
        id: snk
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-code.svg?palette=github-dark&color_snake=#79D2FF&color_dots=#121821,#1B2634,#2C3B4D,#4A6076,#C3CEDA

      - name: add food to the snake
        run: |
          node .github/scripts/snake-food.mjs dist/snake-code.svg '#E3C98F' 0.05

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
