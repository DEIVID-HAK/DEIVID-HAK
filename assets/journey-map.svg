<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Trayectoria: fundamentos en el SENA, productos reales, calidad y entrega, y siguiente paso profesional.">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#05070B"/>
      <stop offset="0.5" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>

    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.12">
      <stop offset="0" stop-color="#6C7888"/>
      <stop offset="0.14" stop-color="#DCE5EF"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.44" stop-color="#AFBCCB"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#C6D1DE"/>
      <stop offset="0.86" stop-color="#8D99A9"/>
      <stop offset="1" stop-color="#E4EBF4"/>
    </linearGradient>

    <linearGradient id="chromeSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B98A8"/>
      <stop offset="0.5" stop-color="#EDF3FA"/>
      <stop offset="1" stop-color="#9AA6B6"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47535F"/>
      <stop offset="0.22" stop-color="#C8D3E0"/>
      <stop offset="0.45" stop-color="#39434F"/>
      <stop offset="0.68" stop-color="#E9EFF7"/>
      <stop offset="0.88" stop-color="#4A5663"/>
      <stop offset="1" stop-color="#8A96A6"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#C9A968" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#FFF3D6"/>
      <stop offset="0.8" stop-color="#E3C98F" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6B2F"/>
      <stop offset="0.5" stop-color="#E3C98F"/>
      <stop offset="1" stop-color="#8A6B2F"/>
    </linearGradient>

    <linearGradient id="goldRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E3C98F"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyanRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79D2FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79D2FF"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.012"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.028"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#79D2FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="screw" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#F4F8FD"/>
      <stop offset="0.55" stop-color="#8D99A9"/>
      <stop offset="1" stop-color="#2A3340"/>
    </radialGradient>

    <pattern id="brush" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 1.5H7" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="0.7"/>
      <path d="M0 4.5H7" stroke="#FFFFFF" stroke-opacity="0.018" stroke-width="0.7"/>
    </pattern>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8FA4BC" stroke-opacity="0.07"/>
    </pattern>

    <style>
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .pulse-slow { animation: pulse 5s ease-in-out infinite; }
      .flow { stroke-dasharray: 5 11; animation: flow 3s linear infinite; }
      .blink { animation: blink 1.5s steps(1) infinite; }
      .sweep { animation: sweep 9s cubic-bezier(.45,0,.25,1) infinite; }
      .sweep-slow { animation: sweep 12s cubic-bezier(.45,0,.25,1) infinite; }
      .gold-run { animation-name: goldrun; animation-timing-function: linear; animation-iteration-count: infinite; animation-duration: 6s; }
      .gold-halo { animation: goldpulse 3.4s ease-in-out infinite; }
      .gold-breathe { animation: goldbreathe 3s ease-in-out infinite; }
      .s1 { animation-delay: .5s; } .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 1.7s; }
      .s4 { animation-delay: 2.3s; } .s5 { animation-delay: 2.9s; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes sweep { 0%, 62% { transform: translateX(-520px); } 92%, 100% { transform: translateX(1320px); } }
      @keyframes goldrun { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
      @keyframes goldpulse { 0%, 100% { opacity: .12; } 50% { opacity: .55; } }
      @keyframes goldbreathe { 0%, 100% { opacity: .22; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <clipPath id="clip"><rect width="1200" height="250" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    
  <rect width="1200" height="250" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="250" rx="20" fill="url(#brush)"/>
  <rect width="1200" height="250" rx="20" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="248.5" rx="19.25"
        fill="none" stroke="url(#edge)" stroke-opacity="0.62" stroke-width="1.5"/>
  <rect x="5" y="5" width="1190" height="240" rx="16"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
  
  <rect x="3.25" y="3.25" width="1193.5" height="243.5" rx="16.75" fill="none" stroke="url(#goldEdge)" stroke-opacity="0.55" stroke-width="1.1"/>
  <rect class="gold-breathe" x="3.25" y="3.25" width="1193.5" height="243.5" rx="16.75" fill="none" stroke="#E3C98F" stroke-width="1.6"/>
  <rect class="gold-halo" x="3.25" y="3.25" width="1193.5" height="243.5" rx="16.75" fill="none" stroke="#E3C98F" stroke-width="10" stroke-opacity="0.3"/>
  <rect class="gold-run" x="3.25" y="3.25" width="1193.5" height="243.5" rx="16.75" fill="none" pathLength="100" stroke="#F4DFAC" stroke-width="11.0" stroke-opacity="0.16" stroke-dasharray="30 70" style="animation-duration:9s"/>
  <rect class="gold-run" x="3.25" y="3.25" width="1193.5" height="243.5" rx="16.75" fill="none" pathLength="100" stroke="#EBD29B" stroke-width="3.8" stroke-linecap="round" stroke-dasharray="30 70" style="animation-duration:9s"/>
  <rect class="gold-run" x="3.25" y="3.25" width="1193.5" height="243.5" rx="16.75" fill="none" pathLength="100" stroke="#FFF8E6" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="4 96" style="animation-duration:9s;animation-delay:-3.60s"/>
  <rect class="gold-run" x="3.25" y="3.25" width="1193.5" height="243.5" rx="16.75" fill="none" pathLength="100" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 99" style="animation-duration:9s;animation-delay:-6.30s"/>
  <circle cx="18" cy="18" r="7" fill="none" stroke="#E3C98F" stroke-width="1.1" stroke-opacity="0.55" class="pulse"/>
  <circle cx="1182" cy="18" r="7" fill="none" stroke="#E3C98F" stroke-width="1.1" stroke-opacity="0.55" class="pulse s2"/>
  <circle cx="18" cy="232" r="7" fill="none" stroke="#E3C98F" stroke-width="1.1" stroke-opacity="0.55" class="pulse s3"/>
  <circle cx="1182" cy="232" r="7" fill="none" stroke="#E3C98F" stroke-width="1.1" stroke-opacity="0.55" class="pulse s4"/>
  <circle cx="18" cy="18" r="4.2" fill="url(#screw)" opacity="0.8"/>
  <circle cx="1182" cy="18" r="4.2" fill="url(#screw)" opacity="0.8"/>
  <circle cx="18" cy="232" r="4.2" fill="url(#screw)" opacity="0.8"/>
  <circle cx="1182" cy="232" r="4.2" fill="url(#screw)" opacity="0.8"/>
    <text class="mono" x="48" y="46" font-size="10.5" letter-spacing="4" fill="#E3C98F">[ TRAYECTORIA ]</text>
    <text class="mono" x="1152" y="46" text-anchor="end" font-size="10" fill="#4B5666">Medellín · Colombia</text>

    <line x1="112" y1="128" x2="988" y2="128" stroke="#2A3441" stroke-width="2"/>
    <line x1="112" y1="128" x2="988" y2="128" stroke="url(#cyanRail)" stroke-width="1.4" class="flow"/>
    
    <g transform="translate(112 128)">
      <circle r="25" fill="#0B1118" stroke="url(#edge)" stroke-width="1.5"/>
      <circle r="25" fill="none" pathLength="100" class="gold-run" stroke="url(#goldTrail)" stroke-width="2" stroke-linecap="round" stroke-dasharray="38 62" style="animation-duration:8s"/>
      <circle r="31" fill="none" stroke="#79D2FF" stroke-width="1.1" opacity="0.3" class="pulse s1"/>
      <text class="mono" y="4.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#79D2FF">01</text>
      <text class="sans" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#E9EFF7">Fundamentos</text>
      <text class="mono" y="76" text-anchor="middle" font-size="9.5" fill="#79D2FF">SENA · ADSO</text>
      <text class="mono" y="94" text-anchor="middle" font-size="9" fill="#6E7C8D">Lógica, SQL, POO y redes.</text>
    </g>
    <g transform="translate(404 128)">
      <circle r="25" fill="#0B1118" stroke="url(#edge)" stroke-width="1.5"/>
      <circle r="25" fill="none" pathLength="100" class="gold-run" stroke="url(#goldTrail)" stroke-width="2" stroke-linecap="round" stroke-dasharray="38 62" style="animation-duration:9s"/>
      <circle r="31" fill="none" stroke="#79D2FF" stroke-width="1.1" opacity="0.3" class="pulse s2"/>
      <text class="mono" y="4.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#79D2FF">02</text>
      <text class="sans" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#E9EFF7">Productos reales</text>
      <text class="mono" y="76" text-anchor="middle" font-size="9.5" fill="#79D2FF">4 sistemas</text>
      <text class="mono" y="94" text-anchor="middle" font-size="9" fill="#6E7C8D">E-commerce, geodatos, juegos, agenda.</text>
    </g>
    <g transform="translate(696 128)">
      <circle r="25" fill="#0B1118" stroke="url(#edge)" stroke-width="1.5"/>
      <circle r="25" fill="none" pathLength="100" class="gold-run" stroke="url(#goldTrail)" stroke-width="2" stroke-linecap="round" stroke-dasharray="38 62" style="animation-duration:10s"/>
      <circle r="31" fill="none" stroke="#79D2FF" stroke-width="1.1" opacity="0.3" class="pulse s3"/>
      <text class="mono" y="4.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#79D2FF">03</text>
      <text class="sans" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#E9EFF7">Calidad y entrega</text>
      <text class="mono" y="76" text-anchor="middle" font-size="9.5" fill="#79D2FF">CI · pruebas · Docker</text>
      <text class="mono" y="94" text-anchor="middle" font-size="9" fill="#6E7C8D">Contratos, validación y entorno reproducible.</text>
    </g>
    <g transform="translate(988 128)">
      <circle r="25" fill="#0B1118" stroke="#2C5A45" stroke-width="1.5"/>
      <circle r="25" fill="none" pathLength="100" class="gold-run" stroke="url(#goldTrail)" stroke-width="2" stroke-linecap="round" stroke-dasharray="38 62" style="animation-duration:11s"/>
      <circle r="31" fill="none" stroke="#79E2A6" stroke-width="1.1" opacity="0.3" class="pulse s4"/>
      <text class="mono" y="4.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#79E2A6">04</text>
      <text class="sans" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#E9EFF7">Siguiente paso</text>
      <text class="mono" y="76" text-anchor="middle" font-size="9.5" fill="#79E2A6">OPEN TO WORK</text>
      <text class="mono" y="94" text-anchor="middle" font-size="9" fill="#6E7C8D">Prácticas o rol junior, Medellín o remoto.</text>
    </g>
  </g>
</svg>
