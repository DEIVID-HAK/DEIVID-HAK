<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Átomo animado: núcleo de cromo con electrones de oro y cian orbitando.">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#05070B"/>
      <stop offset="0.5" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>

    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.12">
      <stop offset="0" stop-color="#6C7888"/>
      <stop offset="0.14" stop-color="#DCE5EF"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.44" stop-color="#AFBCCB"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#C6D1DE"/>
      <stop offset="0.86" stop-color="#8D99A9"/>
      <stop offset="1" stop-color="#E4EBF4"/>
    </linearGradient>

    <linearGradient id="chromeSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B98A8"/>
      <stop offset="0.5" stop-color="#EDF3FA"/>
      <stop offset="1" stop-color="#9AA6B6"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47535F"/>
      <stop offset="0.22" stop-color="#C8D3E0"/>
      <stop offset="0.45" stop-color="#39434F"/>
      <stop offset="0.68" stop-color="#E9EFF7"/>
      <stop offset="0.88" stop-color="#4A5663"/>
      <stop offset="1" stop-color="#8A96A6"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#C9A968" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#FFF3D6"/>
      <stop offset="0.8" stop-color="#E3C98F" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6B2F"/>
      <stop offset="0.5" stop-color="#E3C98F"/>
      <stop offset="1" stop-color="#8A6B2F"/>
    </linearGradient>

    <linearGradient id="goldRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E3C98F"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyanRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79D2FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79D2FF"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.012"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.028"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#79D2FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="screw" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#F4F8FD"/>
      <stop offset="0.55" stop-color="#8D99A9"/>
      <stop offset="1" stop-color="#2A3340"/>
    </radialGradient>

    <pattern id="brush" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 1.5H7" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="0.7"/>
      <path d="M0 4.5H7" stroke="#FFFFFF" stroke-opacity="0.018" stroke-width="0.7"/>
    </pattern>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8FA4BC" stroke-opacity="0.07"/>
    </pattern>

    <style>
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .pulse-slow { animation: pulse 5s ease-in-out infinite; }
      .flow { stroke-dasharray: 5 11; animation: flow 3s linear infinite; }
      .blink { animation: blink 1.5s steps(1) infinite; }
      .sweep { animation: sweep 9s cubic-bezier(.45,0,.25,1) infinite; }
      .sweep-slow { animation: sweep 12s cubic-bezier(.45,0,.25,1) infinite; }
      .gold-run { animation-name: goldrun; animation-timing-function: linear; animation-iteration-count: infinite; animation-duration: 16s; }
      .gold-halo { animation: goldpulse 7s ease-in-out infinite; }
      .s1 { animation-delay: .5s; } .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 1.7s; }
      .s4 { animation-delay: 2.3s; } .s5 { animation-delay: 2.9s; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes sweep { 0%, 62% { transform: translateX(-520px); } 92%, 100% { transform: translateX(1320px); } }
      @keyframes goldrun { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
      @keyframes goldpulse { 0%, 100% { opacity: .2; } 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <clipPath id="clip"><rect width="400" height="400" rx="20"/></clipPath>
    <clipPath id="atomClip"><circle cx="200" cy="200" r="176"/></clipPath>
    <radialGradient id="elGold" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFF8E8"/>
      <stop offset="0.45" stop-color="#E3C98F"/>
      <stop offset="1" stop-color="#8A6B2F"/>
    </radialGradient>
    <radialGradient id="elCyan" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#EAF9FF"/>
      <stop offset="0.45" stop-color="#79D2FF"/>
      <stop offset="1" stop-color="#2E6E8E"/>
    </radialGradient>
    <radialGradient id="elSilver" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#C3CEDA"/>
      <stop offset="1" stop-color="#6C7888"/>
    </radialGradient>
    <radialGradient id="atomGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#79D2FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79D2FF" stop-opacity="0.05"/>
      <stop offset="0.35" stop-color="#C3CEDA" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#E3C98F" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0.05"/>
    </linearGradient>
  
  </defs>

  <g clip-path="url(#atomClip)">
    <circle cx="200" cy="200" r="176" fill="url(#bg)"/>
    <circle cx="200" cy="200" r="176" fill="url(#brush)"/>
    <circle cx="200" cy="200" r="176" fill="url(#grid)"/>
    <circle cx="200" cy="200" r="176" fill="url(#atomGlow)" opacity="0.9"/>

    <circle cx="200" cy="200" r="150" fill="none" stroke="url(#goldEdge)" stroke-width="1" stroke-dasharray="1.5 10" opacity="0.42">
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="-360 200 200" dur="70s" repeatCount="indefinite"/>
    </circle>

    
    <g transform="rotate(-24 200 200)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="30s" repeatCount="indefinite"/>
        <ellipse cx="200" cy="200" rx="146" ry="50" fill="none" stroke="url(#orbitStroke)" stroke-width="1.2" opacity="0.75"/>
        
    <g>
      <animateMotion dur="6.5s" begin="0s" repeatCount="indefinite" path="M 54 200 a 146 50 0 1 0 292 0 a 146 50 0 1 0 -292 0" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <circle r="12.0" fill="url(#glowGold)" opacity="0.4"/>
      <circle r="4.6" fill="url(#elGold)"/>
      <circle cx="-1.4" cy="-1.6" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <g>
      <animateMotion dur="6.5s" begin="-3.2s" repeatCount="indefinite" path="M 54 200 a 146 50 0 1 0 292 0 a 146 50 0 1 0 -292 0" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <circle r="9.9" fill="url(#glowCyan)" opacity="0.4"/>
      <circle r="3.8" fill="url(#elCyan)"/>
      <circle cx="-1.1" cy="-1.3" r="1.1" fill="#FFFFFF" opacity="0.9"/>
    </g>
      </g>
    </g>
    <g transform="rotate(44 200 200)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="-360 200 200" dur="38s" repeatCount="indefinite"/>
        <ellipse cx="200" cy="200" rx="146" ry="50" fill="none" stroke="url(#orbitStroke)" stroke-width="1.2" opacity="0.75"/>
        
    <g>
      <animateMotion dur="8.5s" begin="-1.6s" repeatCount="indefinite" path="M 54 200 a 146 50 0 1 0 292 0 a 146 50 0 1 0 -292 0" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <circle r="10.9" fill="url(#glowCyan)" opacity="0.4"/>
      <circle r="4.2" fill="url(#elSilver)"/>
      <circle cx="-1.3" cy="-1.5" r="1.3" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <g>
      <animateMotion dur="8.5s" begin="-5.6s" repeatCount="indefinite" path="M 54 200 a 146 50 0 1 0 292 0 a 146 50 0 1 0 -292 0" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <circle r="8.8" fill="url(#glowGold)" opacity="0.4"/>
      <circle r="3.4" fill="url(#elGold)"/>
      <circle cx="-1.0" cy="-1.2" r="1.0" fill="#FFFFFF" opacity="0.9"/>
    </g>
      </g>
    </g>
    <g transform="rotate(100 200 200)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="24s" repeatCount="indefinite"/>
        <ellipse cx="200" cy="200" rx="146" ry="50" fill="none" stroke="url(#orbitStroke)" stroke-width="1.2" opacity="0.75"/>
        
    <g>
      <animateMotion dur="5.5s" begin="-2.4s" repeatCount="indefinite" path="M 54 200 a 146 50 0 1 0 292 0 a 146 50 0 1 0 -292 0" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <circle r="11.4" fill="url(#glowCyan)" opacity="0.4"/>
      <circle r="4.4" fill="url(#elCyan)"/>
      <circle cx="-1.3" cy="-1.5" r="1.3" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <g>
      <animateMotion dur="5.5s" begin="-4.6s" repeatCount="indefinite" path="M 54 200 a 146 50 0 1 0 292 0 a 146 50 0 1 0 -292 0" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <circle r="9.4" fill="url(#glowCyan)" opacity="0.4"/>
      <circle r="3.6" fill="url(#elSilver)"/>
      <circle cx="-1.1" cy="-1.3" r="1.1" fill="#FFFFFF" opacity="0.9"/>
    </g>
      </g>
    </g>
    
    <g>
      <animateMotion dur="19s" begin="0s" repeatCount="indefinite" path="M 82 200 a 118 118 0 1 1 236 0 a 118 118 0 1 1 -236 0"/>
      <circle r="2.1" fill="url(#elGold)">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" begin="0s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <animateMotion dur="27s" begin="-9s" repeatCount="indefinite" path="M 66 200 a 134 134 0 1 1 268 0 a 134 134 0 1 1 -268 0"/>
      <circle r="1.7" fill="url(#elCyan)">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" begin="-9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <animateMotion dur="39s" begin="-18s" repeatCount="indefinite" path="M 98 200 a 102 102 0 1 1 204 0 a 102 102 0 1 1 -204 0"/>
      <circle r="1.6" fill="url(#elSilver)">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" begin="-18s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle cx="200" cy="200" r="46" fill="url(#atomGlow)" opacity="0.75" class="pulse-slow"/>
    <g>
      <circle cx="200" cy="200" r="17" fill="url(#chrome)" stroke="#E3C98F" stroke-opacity="0.55" stroke-width="1"/>
      <circle cx="200" cy="200" r="6.5" fill="#79D2FF" opacity="0.92" class="pulse"/>
      <circle cx="195" cy="194" r="3" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <circle cx="200" cy="200" r="27" fill="none" stroke="url(#goldTrail)" stroke-width="1.4" pathLength="100"
            stroke-dasharray="12 88" class="gold-run" style="animation-duration:9s"/>
  </g>

  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#edge)" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05"/>
  <circle class="gold-halo" cx="200" cy="200" r="176" fill="none" stroke="#E3C98F" stroke-width="6" stroke-opacity="0.22"/>
  <circle cx="200" cy="200" r="176" fill="none" pathLength="100" stroke="url(#goldEdge)" stroke-opacity="0.55" stroke-width="1"/>
  <circle class="gold-run" cx="200" cy="200" r="176" fill="none" pathLength="100" stroke="url(#goldTrail)" stroke-width="3.6" stroke-opacity="0.22" stroke-linecap="round" stroke-dasharray="8 92" style="animation-duration:12s"/>
  <circle class="gold-run" cx="200" cy="200" r="176" fill="none" pathLength="100" stroke="url(#goldTrail)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="8 92" style="animation-duration:12s"/>
  <circle class="gold-run" cx="200" cy="200" r="176" fill="none" pathLength="100" stroke="#FFF3D6" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1.2 98.8" style="animation-duration:12s;animation-delay:-6s"/>
  
</svg>
