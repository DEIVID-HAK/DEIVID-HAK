<svg xmlns="http://www.w3.org/2000/svg" width="940" height="220" viewBox="0 0 940 220" role="img" aria-label="Pac-Man comiendo commits">
  <defs>
    <g id="pacman">
      <g class="ju">
        <path d="M 0 0 L 30 0 A 30 30 0 0 0 -30 0 Z" fill="#FFE135"/>
      </g>
      <g class="jl">
        <path d="M 0 0 L 30 0 A 30 30 0 0 1 -30 0 Z" fill="#FFE135"/>
      </g>
      <circle cx="8" cy="-13" r="3.5" fill="#1C1000"/>
    </g>
    <g id="ghost">
      <path d="M -15 13 L -15 -1 A 15 15 0 0 1 15 -1 L 15 13 L 10 8 L 5 13 L 0 8 L -5 13 L -10 8 Z"/>
      <ellipse cx="-5.5" cy="-3" rx="5" ry="6" fill="#FFFFFF"/>
      <ellipse cx="5.5" cy="-3" rx="5" ry="6" fill="#FFFFFF"/>
      <circle cx="-3.5" cy="-2.5" r="2.4" fill="#1E0710"/>
      <circle cx="7.5" cy="-2.5" r="2.4" fill="#1E0710"/>
    </g>
    <g id="life">
      <circle r="6.5" fill="#FFE135"/>
      <path d="M 0 0 L 7 -2.6 A 7 7 0 0 1 7 2.6 Z" fill="#120409"/>
      <circle cx="1.5" cy="-3" r="1.2" fill="#1C1000"/>
    </g>
    <style>
      .run { animation: run 7s linear infinite; }
      @keyframes run { from { transform: translateX(-110px); } to { transform: translateX(1010px); } }
      .ju { transform-box: fill-box; transform-origin: 50% 100%; animation: chompU 0.38s ease-in-out infinite; }
      @keyframes chompU { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-26deg); } }
      .jl { transform-box: fill-box; transform-origin: 50% 0%; animation: chompL 0.38s ease-in-out infinite; }
      @keyframes chompL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(26deg); } }
      .bob { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 0.85s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      .pellet { animation: eat 7s linear infinite; }
      @keyframes eat { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 1; } }
      .pulse { animation: pulse 0.7s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity: 1; } to { opacity: 0.45; } }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="940" height="220" rx="14" fill="#120409"/>
  <g transform="translate(805.0 100.0) scale(1.635)" opacity="0.22">
      <g fill="none" stroke="#E0608A" stroke-width="1.6">
        <ellipse rx="46" ry="17"/>
        <ellipse rx="46" ry="17" transform="rotate(60)"/>
        <ellipse rx="46" ry="17" transform="rotate(120)"/>
      </g>
      <circle r="7" fill="#E0608A" fill-opacity="0.8"/>
      <circle r="3" fill="#FFE7ED"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/><circle cx="46" cy="0" r="3.2" fill="#FFE7ED"/></g>
      <g transform="rotate(60)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/><circle cx="46" cy="0" r="2.8" fill="#E0608A"/></g></g>
      <g transform="rotate(120)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="15s" repeatCount="indefinite"/><circle cx="46" cy="0" r="2.4" fill="#FFE7ED"/></g></g>
    </g>
  <rect width="940" height="220" rx="14" fill="none" stroke="#5A1230" stroke-width="2"/>
  <rect x="0" y="0" width="940" height="34" rx="14" fill="#1E0710"/>
  <rect x="0" y="24" width="940" height="10" fill="#1E0710"/>
  <line x1="0" y1="34" x2="940" y2="34" stroke="#5A1230" stroke-width="1"/>
  <circle cx="20" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="17" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="17" r="6" fill="#27C93F"/>
  <text x="84" y="22" font-family="'Cascadia Code','Consolas',monospace" font-size="13" fill="#B08A98">david@velez-dev: ~/commits</text>
  <text x="922" y="22" text-anchor="end" font-family="'Cascadia Code','Consolas',monospace" font-size="13" fill="#E0A64A">● grabando</text>

  <g font-family="'Cascadia Code','Consolas',monospace" font-size="14" font-weight="700">
    <text x="110" y="64" fill="#B08A98">SCORE <tspan fill="#FFE135">001200</tspan></text>
    <text x="300" y="64" fill="#B08A98">HI <tspan fill="#FFE135">009999</tspan></text>
    <text x="470" y="64" fill="#B08A98">LIVES</text>
    <use href="#life" x="534" y="58"/>
    <use href="#life" x="552" y="58"/>
    <use href="#life" x="570" y="58"/>
    <text x="640" y="64" fill="#B08A98">LEVEL <tspan fill="#E0A64A">06</tspan></text>
  </g>

  <text x="24" y="96" font-family="'Cascadia Code','Consolas',monospace" font-size="15" fill="#B08A98">$ <tspan fill="#E0A64A">git commit -m</tspan> "shipping features" <tspan fill="#B01E45">▊</tspan></text>

  <g fill="none" stroke-linecap="round" opacity="0.8">
    <line x1="50" y1="114" x2="890" y2="114" stroke="#8C1A3E" stroke-width="3"/>
    <line x1="50" y1="176" x2="890" y2="176" stroke="#8C1A3E" stroke-width="3"/>
  </g>
  <g fill="none" stroke-linecap="round" opacity="0.6" stroke="#8C1A3E" stroke-width="3">
    <line x1="130" y1="176" x2="130" y2="162"/>
    <line x1="250" y1="114" x2="250" y2="128"/>
    <line x1="370" y1="176" x2="370" y2="162"/>
    <line x1="490" y1="114" x2="490" y2="128"/>
    <line x1="610" y1="176" x2="610" y2="162"/>
    <line x1="730" y1="114" x2="730" y2="128"/>
  </g>

  <g fill="#F8F8F8">
    <circle class="pellet" cx="110" cy="145" r="4.5" style="animation-delay:1.21s"/>
    <circle class="pellet" cx="160" cy="145" r="4.5" style="animation-delay:1.53s"/>
    <circle class="pellet" cx="210" cy="145" r="4.5" style="animation-delay:1.84s"/>
    <circle class="pellet" cx="260" cy="145" r="4.5" style="animation-delay:2.15s"/>
    <circle class="pellet" cx="310" cy="145" r="4.5" style="animation-delay:2.46s"/>
    <circle class="pellet" cx="360" cy="145" r="4.5" style="animation-delay:2.78s"/>
    <circle class="pellet" cx="410" cy="145" r="4.5" style="animation-delay:3.09s"/>
    <circle class="pellet" cx="460" cy="145" r="4.5" style="animation-delay:3.40s"/>
    <circle class="pellet" cx="510" cy="145" r="4.5" style="animation-delay:3.71s"/>
    <circle class="pellet" cx="560" cy="145" r="4.5" style="animation-delay:4.03s"/>
    <circle class="pellet" cx="610" cy="145" r="4.5" style="animation-delay:4.34s"/>
    <circle class="pellet" cx="660" cy="145" r="4.5" style="animation-delay:4.65s"/>
    <circle class="pellet" cx="710" cy="145" r="4.5" style="animation-delay:4.96s"/>
    <circle class="pellet" cx="760" cy="145" r="4.5" style="animation-delay:5.28s"/>
    <circle class="pellet" cx="810" cy="145" r="4.5" style="animation-delay:5.59s"/>
  </g>
  <g class="pellet" style="animation-delay:5.90s">
    <circle class="pulse" cx="860" cy="145" r="9" fill="#F8F8F8"/>
  </g>

  <g transform="translate(0,145)">
    <g class="run">
      <use href="#pacman" transform="scale(0.85)"/>
      <g transform="translate(-130,8)">
        <g class="bob">
          <use href="#ghost" fill="#FF0000" transform="scale(0.85)"/>
        </g>
      </g>
      <g transform="translate(-260,8)">
        <g class="bob" style="animation-delay:0.2s">
          <use href="#ghost" fill="#FFC9DC" transform="scale(0.85)"/>
        </g>
      </g>
      <g transform="translate(-390,8)">
        <g class="bob" style="animation-delay:0.4s">
          <use href="#ghost" fill="#E0608A" transform="scale(0.85)"/>
        </g>
      </g>
      <g transform="translate(-520,8)">
        <g class="bob" style="animation-delay:0.6s">
          <use href="#ghost" fill="#FFB852" transform="scale(0.85)"/>
        </g>
      </g>
    </g>
