  <text x="24" y="204" font-family="'Cascadia Code','Consolas',monospace" font-size="13" fill="#7A3C4E">commits today: 12 · streak: 14 days · chasing bugs</text>
  <rect class="cur" x="400" y="192" width="9" height="15" fill="#E0A64A"/>
</svg>
