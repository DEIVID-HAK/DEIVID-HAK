    <text x="280" y="248.5" class="code" xml:space="preserve">  <tspan class="p">education</tspan><tspan class="o">: </tspan><tspan class="s">"ADSO · SENA · 6th semester"</tspan><tspan class="o">,</tspan></text>
    <text x="280" y="268" class="code" xml:space="preserve">  <tspan class="p">focus</tspan><tspan class="o">: [</tspan><tspan class="s">"REST APIs"</tspan><tspan class="o">, </tspan><tspan class="s">"Data modeling"</tspan><tspan class="o">, </tspan><tspan class="s">"DevOps"</tspan><tspan class="o">],</tspan></text>
    <text x="280" y="287.5" class="code" xml:space="preserve">  <tspan class="p">stack</tspan><tspan class="o">: [</tspan><tspan class="s">"JavaScript"</tspan><tspan class="o">, </tspan><tspan class="s">"Java"</tspan><tspan class="o">, </tspan><tspan class="s">"Python"</tspan><tspan class="o">, </tspan><tspan class="s">"React"</tspan><tspan class="o">,</tspan></text>
    <text x="280" y="307" class="code" xml:space="preserve">          <tspan class="s">"Node.js"</tspan><tspan class="o">, </tspan><tspan class="s">"Django"</tspan><tspan class="o">, </tspan><tspan class="s">"FastAPI"</tspan><tspan class="o">, </tspan><tspan class="s">"PostgreSQL"</tspan><tspan class="o">,</tspan></text>
    <text x="280" y="326.5" class="code" xml:space="preserve">          <tspan class="s">"MySQL"</tspan><tspan class="o">, </tspan><tspan class="s">"MongoDB"</tspan><tspan class="o">, </tspan><tspan class="s">"Docker"</tspan><tspan class="o">, </tspan><tspan class="s">"Kubernetes"</tspan><tspan class="o">],</tspan></text>
