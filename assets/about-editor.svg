<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="About David Velez rendered as a TypeScript code editor">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E0710"/>
      <stop offset="0.55" stop-color="#19050C"/>
      <stop offset="1" stop-color="#120409"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E0A17"/>
      <stop offset="1" stop-color="#1E0710"/>
    </linearGradient>
    <linearGradient id="status" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7E1030"/>
      <stop offset="1" stop-color="#B01E45"/>
    </linearGradient>
    <linearGradient id="tabline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0608A"/>
      <stop offset="1" stop-color="#B01E45" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#B01E45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#5A1230" stroke-width="0.6" opacity="0.22"/>
    </pattern>
    <clipPath id="winClip">
      <rect x="20" y="20" width="1160" height="460" rx="18"/>
    </clipPath>
    <clipPath id="avatarClip">
      <circle cx="70" cy="366" r="24"/>
    </clipPath>
    <style>
      .ui { font-family: 'Inter','Segoe UI',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace; }
      .ln { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; font-size: 12px; fill: #8A5566; }
      .code { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace; font-size: 14.5px; }
      .c { fill: #A86C80; font-style: italic; }
      .k { fill: #E0608A; }
      .p { fill: #F6C6D2; }
      .s { fill: #EBC07A; }
      .v { fill: #FFE7ED; }
      .o { fill: #A86C80; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .online { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      .lift { animation: lift 6s ease-in-out infinite alternate; }
      @keyframes lift { from { transform: translateY(0); } to { transform: translateY(-2px); } }
    </style>
  </defs>

