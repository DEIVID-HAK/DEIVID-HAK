<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Core strengths: backend, data, frontend and DevOps">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#220710"/>
      <stop offset="1" stop-color="#19050C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B01E45"/>
      <stop offset="0.6" stop-color="#E0608A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E0608A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iconGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#B01E45" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ui { font-family: 'Inter','Segoe UI',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
      .pulse { animation: pulse 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      .tag { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; font-size: 9.5px; fill: #F6C6D2; }
    </style>
  </defs>

  <g>
    <rect x="30" y="20" width="555" height="164" rx="16" fill="url(#card)" stroke="#5A1230"/>
    <rect x="31" y="21" width="553" height="2" rx="1" fill="url(#accent)"/>
    <text x="561" y="48" class="mono" font-size="30" fill="#5A1230" opacity="0.55" text-anchor="end">01</text>
    <circle cx="75" cy="65" r="30" fill="url(#iconGlow)" class="pulse"/>
    <rect x="52" y="42" width="46" height="46" rx="12" fill="#300A18" stroke="#5A1230"/>
    <g transform="translate(63 53)" fill="none" stroke="#E0608A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="2" width="22" height="6" rx="2"/>
      <rect x="1" y="9" width="22" height="6" rx="2"/>
      <rect x="1" y="16" width="22" height="6" rx="2"/>
      <circle cx="5.5" cy="5" r="1" fill="#F6C6D2" stroke="none"/>
      <circle cx="5.5" cy="12" r="1" fill="#F6C6D2" stroke="none"/>
      <circle cx="5.5" cy="19" r="1" fill="#F6C6D2" stroke="none"/>
      <path d="M11 5h7M11 12h7M11 19h7" opacity="0.65"/>
    </g>
    <text x="112" y="72" class="ui" font-size="19" font-weight="700" fill="#F8E8ED">Backend &amp; APIs</text>
    <text x="112" y="92" class="mono" font-size="10.5" fill="#F6C6D2">Node.js · Django · FastAPI · REST</text>
    <text x="54" y="120" class="ui" font-size="12.5" fill="#DBAEBE">REST services with clear contracts, validation</text>
    <text x="54" y="136" class="ui" font-size="12.5" fill="#DBAEBE">and maintainable business logic.</text>
    <rect x="54" y="148" width="48" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="78" y="162" class="tag" text-anchor="middle">REST</text>
    <rect x="110" y="148" width="48" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="134" y="162" class="tag" text-anchor="middle">CRUD</text>
    <rect x="166" y="148" width="48" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="190" y="162" class="tag" text-anchor="middle">JSON</text>
  </g>

  <g>
    <rect x="615" y="20" width="555" height="164" rx="16" fill="url(#card)" stroke="#5A1230"/>
    <rect x="616" y="21" width="553" height="2" rx="1" fill="url(#accent)"/>
    <text x="1146" y="48" class="mono" font-size="30" fill="#5A1230" opacity="0.55" text-anchor="end">02</text>
    <circle cx="660" cy="65" r="30" fill="url(#iconGlow)" class="pulse" style="animation-delay:-1.2s"/>
    <rect x="637" y="42" width="46" height="46" rx="12" fill="#300A18" stroke="#5A1230"/>
    <g transform="translate(648 53)" fill="none" stroke="#E0608A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3.5"/>
      <path d="M3 5v14c0 1.9 4 3.5 9 3.5s9-1.6 9-3.5V5"/>
      <path d="M3 12c0 1.9 4 3.5 9 3.5s9-1.6 9-3.5" opacity="0.75"/>
      <circle cx="6" cy="8" r="0.8" fill="#F6C6D2" stroke="none"/>
    </g>
    <text x="697" y="72" class="ui" font-size="19" font-weight="700" fill="#F8E8ED">Data &amp; SQL</text>
    <text x="697" y="92" class="mono" font-size="10.5" fill="#F6C6D2">PostgreSQL · MySQL · MongoDB</text>
    <text x="639" y="120" class="ui" font-size="12.5" fill="#DBAEBE">Relational modeling, query tuning and data</text>
    <text x="639" y="136" class="ui" font-size="12.5" fill="#DBAEBE">integrity from schema to production.</text>
    <rect x="639" y="148" width="44" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="661" y="162" class="tag" text-anchor="middle">SQL</text>
    <rect x="691" y="148" width="70" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="726" y="162" class="tag" text-anchor="middle">Modeling</text>
    <rect x="769" y="148" width="58" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="798" y="162" class="tag" text-anchor="middle">NoSQL</text>
  </g>

  <g>
    <rect x="30" y="196" width="555" height="164" rx="16" fill="url(#card)" stroke="#5A1230"/>
    <rect x="31" y="197" width="553" height="2" rx="1" fill="url(#accent)"/>
    <text x="561" y="224" class="mono" font-size="30" fill="#5A1230" opacity="0.55" text-anchor="end">03</text>
    <circle cx="75" cy="241" r="30" fill="url(#iconGlow)" class="pulse" style="animation-delay:-2.1s"/>
    <rect x="52" y="218" width="46" height="46" rx="12" fill="#300A18" stroke="#5A1230"/>
    <g transform="translate(63 229)" fill="none" stroke="#E0608A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="18" rx="3"/>
      <path d="M2 8h20"/>
      <circle cx="5" cy="5.5" r="0.8" fill="#F6C6D2" stroke="none"/>
      <circle cx="7.6" cy="5.5" r="0.8" fill="#F6C6D2" stroke="none"/>
      <circle cx="10.2" cy="5.5" r="0.8" fill="#F6C6D2" stroke="none"/>
      <rect x="5" y="11" width="6" height="6" rx="1.5" opacity="0.8"/>
      <path d="M14 11h5M14 14h5M14 17h3" opacity="0.8"/>
    </g>
    <text x="112" y="248" class="ui" font-size="19" font-weight="700" fill="#F8E8ED">Frontend</text>
    <text x="112" y="268" class="mono" font-size="10.5" fill="#F6C6D2">React · Tailwind · Responsive UI</text>
    <text x="54" y="296" class="ui" font-size="12.5" fill="#DBAEBE">Reusable components and interfaces that feel</text>
    <text x="54" y="312" class="ui" font-size="12.5" fill="#DBAEBE">fast, accessible and easy to maintain.</text>
    <rect x="54" y="324" width="52" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="80" y="338" class="tag" text-anchor="middle">React</text>
    <rect x="114" y="324" width="66" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="147" y="338" class="tag" text-anchor="middle">Tailwind</text>
    <rect x="188" y="324" width="78" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="227" y="338" class="tag" text-anchor="middle">Responsive</text>
  </g>

  <g>
    <rect x="615" y="196" width="555" height="164" rx="16" fill="url(#card)" stroke="#5A1230"/>
    <rect x="616" y="197" width="553" height="2" rx="1" fill="url(#accent)"/>
    <text x="1146" y="224" class="mono" font-size="30" fill="#5A1230" opacity="0.55" text-anchor="end">04</text>
    <circle cx="660" cy="241" r="30" fill="url(#iconGlow)" class="pulse" style="animation-delay:-3.3s"/>
    <rect x="637" y="218" width="46" height="46" rx="12" fill="#300A18" stroke="#5A1230"/>
    <g transform="translate(648 229)" fill="none" stroke="#E0608A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l9 5v10l-9 5-9-5V7z"/>
      <path d="M3 7l9 5 9-5M12 12v10" opacity="0.8"/>
      <path d="M7.5 9.5l9 5" opacity="0.45"/>
    </g>
    <text x="697" y="248" class="ui" font-size="19" font-weight="700" fill="#F8E8ED">DevOps</text>
    <text x="697" y="268" class="mono" font-size="10.5" fill="#F6C6D2">Docker · Kubernetes · GitHub Actions</text>
    <text x="639" y="296" class="ui" font-size="12.5" fill="#DBAEBE">Containerized environments and automated</text>
    <text x="639" y="312" class="ui" font-size="12.5" fill="#DBAEBE">pipelines, reproducible from commit to deploy.</text>
    <rect x="639" y="324" width="58" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="668" y="338" class="tag" text-anchor="middle">Docker</text>
    <rect x="705" y="324" width="44" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="727" y="338" class="tag" text-anchor="middle">K8s</text>
    <rect x="757" y="324" width="54" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <text x="784" y="338" class="tag" text-anchor="middle">CI/CD</text>
  </g>
</svg>
