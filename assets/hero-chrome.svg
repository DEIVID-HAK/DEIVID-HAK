<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="David Vélez — desarrollador full stack. Backend, APIs y datos. Medellín, Colombia.">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#05070B"/>
      <stop offset="0.5" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>

    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.12">
      <stop offset="0" stop-color="#6C7888"/>
      <stop offset="0.14" stop-color="#DCE5EF"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.44" stop-color="#AFBCCB"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#C6D1DE"/>
      <stop offset="0.86" stop-color="#8D99A9"/>
      <stop offset="1" stop-color="#E4EBF4"/>
    </linearGradient>

    <linearGradient id="chromeSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B98A8"/>
      <stop offset="0.5" stop-color="#EDF3FA"/>
      <stop offset="1" stop-color="#9AA6B6"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47535F"/>
      <stop offset="0.22" stop-color="#C8D3E0"/>
      <stop offset="0.45" stop-color="#39434F"/>
      <stop offset="0.68" stop-color="#E9EFF7"/>
      <stop offset="0.88" stop-color="#4A5663"/>
      <stop offset="1" stop-color="#8A96A6"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyanRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79D2FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79D2FF"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E3C98F"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.012"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.028"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#79D2FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="screw" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#F4F8FD"/>
      <stop offset="0.55" stop-color="#8D99A9"/>
      <stop offset="1" stop-color="#2A3340"/>
    </radialGradient>

    <pattern id="brush" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 1.5H7" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="0.7"/>
      <path d="M0 4.5H7" stroke="#FFFFFF" stroke-opacity="0.018" stroke-width="0.7"/>
    </pattern>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8FA4BC" stroke-opacity="0.07"/>
    </pattern>

    <style>
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .pulse-slow { animation: pulse 5s ease-in-out infinite; }
      .flow { stroke-dasharray: 5 11; animation: flow 3s linear infinite; }
      .blink { animation: blink 1.5s steps(1) infinite; }
      .sweep { animation: sweep 9s cubic-bezier(.45,0,.25,1) infinite; }
      .sweep-slow { animation: sweep 12s cubic-bezier(.45,0,.25,1) infinite; }
      .s1 { animation-delay: .5s; } .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 1.7s; }
      .s4 { animation-delay: 2.3s; } .s5 { animation-delay: 2.9s; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes sweep { 0%, 62% { transform: translateX(-520px); } 92%, 100% { transform: translateX(1320px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <clipPath id="clip"><rect width="1200" height="420" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    
  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#brush)"/>
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="19.25"
        fill="none" stroke="url(#edge)" stroke-opacity="0.62" stroke-width="1.5"/>
  <rect x="5" y="5" width="1190" height="410" rx="16"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <circle cx="18" cy="18" r="4.2" fill="url(#screw)" opacity="0.8"/>
  <circle cx="1182" cy="18" r="4.2" fill="url(#screw)" opacity="0.8"/>
  <circle cx="18" cy="402" r="4.2" fill="url(#screw)" opacity="0.8"/>
  <circle cx="1182" cy="402" r="4.2" fill="url(#screw)" opacity="0.8"/>
    <ellipse cx="90" cy="60" rx="340" ry="200" fill="url(#glowCyan)" opacity="0.55"/>
    <ellipse cx="1080" cy="380" rx="320" ry="200" fill="url(#glowGold)" opacity="0.5"/>

    <!-- top bar -->
    <rect width="1200" height="46" fill="#070A0F" opacity="0.92"/>
    <circle cx="30" cy="23" r="5" fill="#F2F5F9" opacity="0.85"/>
    <circle cx="48" cy="23" r="5" fill="#9EAABA" opacity="0.8"/>
    <circle cx="66" cy="23" r="5" fill="#4E5A69" opacity="0.9"/>
    <text class="mono" x="92" y="28" font-size="11.5" fill="#6E7C8D">david@medellin:~/profile</text>
    <text class="mono" x="1148" y="28" text-anchor="end" font-size="10.5" fill="#4B5666">chrome · es-CO · UTC-5</text>
    <line x1="0" y1="46" x2="1200" y2="46" stroke="url(#edge)" stroke-opacity="0.5"/>

    <!-- left column -->
    <text class="mono" x="54" y="102" font-size="11.5" letter-spacing="4.2" fill="#79D2FF">[ FULL STACK DEVELOPER · BACKEND &amp; DATA ]</text>
    <text class="sans" x="50" y="184" font-size="68" font-weight="800" letter-spacing="-1.8" fill="url(#chrome)">DAVID VÉLEZ</text>
    <text class="sans" x="54" y="222" font-size="18.5" fill="#A9B6C6">Modelo los datos, construyo la API y entrego la interfaz.</text>
    <text class="mono" x="54" y="248" font-size="12.5" fill="#6E7C8D">ADSO · SENA Medellín · 6.º semestre · disponible para prácticas o rol junior.</text>

    <g transform="translate(54 276)">
      <g transform="translate(0 0)">
      <rect width="148" height="24" rx="12" fill="#0D1A16" stroke="#2C5A45" stroke-opacity="1"/>
      <text class="mono" x="74" y="15.7" text-anchor="middle" font-size="10.5" fill="#A9B6C6"></text>
    </g>
      <circle cx="18" cy="12" r="4" fill="#79E2A6" class="pulse"/>
      <text class="mono" x="30" y="16" font-size="10.5" fill="#CFEEDF" letter-spacing="0.6">OPEN TO WORK</text>
      <g transform="translate(160 0)">
      <rect width="186" height="24" rx="12" fill="#0E141C" stroke="#27313D" stroke-opacity="1"/>
      <text class="mono" x="93" y="15.7" text-anchor="middle" font-size="10.5" fill="#C3CEDA">PRÁCTICAS · JUNIOR</text>
    </g>
      <g transform="translate(358 0)">
      <rect width="156" height="24" rx="12" fill="#0E141C" stroke="#27313D" stroke-opacity="1"/>
      <text class="mono" x="78" y="15.7" text-anchor="middle" font-size="10.5" fill="#C3CEDA">MEDELLÍN · CO</text>
    </g>
    </g>

    <text class="mono" x="54" y="356" font-size="12.5" fill="#4B5666">// software que se puede explicar, probar y desplegar.</text>
    <rect class="blink" x="468" y="345" width="7" height="12" fill="#79D2FF" opacity="0.85"/>

    <!-- right column: lifecycle -->
    <g transform="translate(718 84)">
      <rect width="424" height="256" rx="16" fill="url(#panel)" stroke="url(#edge)" stroke-opacity="0.55"/>
      <rect x="0.5" y="0.5" width="423" height="255" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <rect x="0" y="0" width="424" height="2.5" rx="1.2" fill="url(#goldRail)" opacity="0.85"/>

      <text class="mono" x="24" y="32" font-size="10" letter-spacing="2.6" fill="#E3C98F">REQUEST LIFECYCLE</text>
      <text class="mono" x="400" y="32" text-anchor="end" font-size="9.5" fill="#4B5666">p95 · 84 ms</text>

      <line x1="30" y1="68" x2="30" y2="206" stroke="url(#cyanRail)" stroke-width="1.4" stroke-opacity="0.7" class="flow"/>
      
    <g transform="translate(0 56)">
      <circle cx="30" cy="12" r="8.5" fill="#0C1219" stroke="url(#chromeSoft)" stroke-width="1.4"/>
      <circle cx="30" cy="12" r="3" fill="#79D2FF" class="pulse "/>
      <text class="sans" x="52" y="10" font-size="12.5" font-weight="700" fill="#E9EFF7">INTERFAZ</text>
      <text class="mono" x="52" y="26" font-size="10" fill="#6E7C8D">React · Vite · Tailwind</text>
      <text class="mono" x="378" y="17" text-anchor="end" font-size="9.5" fill="#79E2A6">200 OK</text>
    </g>
    <g transform="translate(0 99)">
      <circle cx="30" cy="12" r="8.5" fill="#0C1219" stroke="url(#chromeSoft)" stroke-width="1.4"/>
      <circle cx="30" cy="12" r="3" fill="#79D2FF" class="pulse s1"/>
      <text class="sans" x="52" y="10" font-size="12.5" font-weight="700" fill="#E9EFF7">API</text>
      <text class="mono" x="52" y="26" font-size="10" fill="#6E7C8D">Java · Node · FastAPI</text>
      <text class="mono" x="378" y="17" text-anchor="end" font-size="9.5" fill="#79E2A6">200 OK</text>
    </g>
    <g transform="translate(0 142)">
      <circle cx="30" cy="12" r="8.5" fill="#0C1219" stroke="url(#chromeSoft)" stroke-width="1.4"/>
      <circle cx="30" cy="12" r="3" fill="#79D2FF" class="pulse s2"/>
      <text class="sans" x="52" y="10" font-size="12.5" font-weight="700" fill="#E9EFF7">DATOS</text>
      <text class="mono" x="52" y="26" font-size="10" fill="#6E7C8D">PostgreSQL · PostGIS · SQLite</text>
      <text class="mono" x="378" y="17" text-anchor="end" font-size="9.5" fill="#79E2A6">201 OK</text>
    </g>
    <g transform="translate(0 185)">
      <circle cx="30" cy="12" r="8.5" fill="#0C1219" stroke="url(#chromeSoft)" stroke-width="1.4"/>
      <circle cx="30" cy="12" r="3" fill="#79D2FF" class="pulse s3"/>
      <text class="sans" x="52" y="10" font-size="12.5" font-weight="700" fill="#E9EFF7">ENTREGA</text>
      <text class="mono" x="52" y="26" font-size="10" fill="#6E7C8D">Docker · Actions · Nginx</text>
      <text class="mono" x="378" y="17" text-anchor="end" font-size="9.5" fill="#79E2A6">204 OK</text>
    </g>

      <line x1="24" y1="228" x2="400" y2="228" stroke="#1B232D"/>
      <text class="mono" x="24" y="245" font-size="10" fill="#6E7C8D">$ deploy --target production</text>
      <text class="mono" x="400" y="245" text-anchor="end" font-size="9.5" fill="#79E2A6">ready ✓</text>
    </g>

    
  <g clip-path="url(#clip)" transform="rotate(-16 600 210)">
    <rect class="sweep" x="-300" y="-160" width="230" height="760" fill="url(#sheen)"/>
  </g>
  </g>
</svg>
