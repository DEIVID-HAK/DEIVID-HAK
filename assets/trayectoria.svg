<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Trayectoria de David Velez: bases en SENA, construcción de proyectos, entrega y siguiente paso.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080205"/>
      <stop offset="1" stop-color="#1B0610"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A1024"/>
      <stop offset="0.5" stop-color="#E0608A"/>
      <stop offset="1" stop-color="#7E1030"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="330" rx="22"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Inter', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .p2 { animation-delay: .8s; }
      .p3 { animation-delay: 1.6s; }
      .p4 { animation-delay: 2.4s; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <text class="mono" x="48" y="48" font-size="11" letter-spacing="4" fill="#E0608A">[ TRAYECTORIA ]</text>
    <text class="mono" x="1152" y="48" text-anchor="end" font-size="10" fill="#7A5060">aprender → construir → entregar → seguir</text>

    <line x1="110" y1="112" x2="1090" y2="112" stroke="url(#rail)" stroke-width="1.6"/>

    <g transform="translate(110 112)">
      <circle r="8" fill="#E0608A" class="pulse"/>
      <circle r="15" fill="none" stroke="#E0608A" stroke-opacity="0.35"/>
      <text class="mono" y="-30" text-anchor="middle" font-size="11" letter-spacing="1.6" fill="#E0608A">2025</text>
      <text class="sans" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF3F6">Bases</text>
      <text class="sans" y="70" text-anchor="middle" font-size="11" fill="#B08A98">ADSO en SENA</text>
      <text class="sans" y="88" text-anchor="middle" font-size="11" fill="#8A5F6F">software, SQL y Git</text>
    </g>

    <g transform="translate(440 112)">
      <circle r="8" fill="#E0608A" class="pulse p2"/>
      <circle r="15" fill="none" stroke="#E0608A" stroke-opacity="0.35"/>
      <text class="mono" y="-30" text-anchor="middle" font-size="11" letter-spacing="1.6" fill="#E0608A">2026</text>
      <text class="sans" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF3F6">Construcción</text>
      <text class="sans" y="70" text-anchor="middle" font-size="11" fill="#B08A98">cuatro proyectos reales</text>
      <text class="sans" y="88" text-anchor="middle" font-size="11" fill="#8A5F6F">API, datos e interfaz</text>
    </g>

    <g transform="translate(760 112)">
      <circle r="8" fill="#E0608A" class="pulse p3"/>
      <circle r="15" fill="none" stroke="#E0608A" stroke-opacity="0.35"/>
      <text class="mono" y="-30" text-anchor="middle" font-size="11" letter-spacing="1.6" fill="#E0608A">2026</text>
      <text class="sans" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF3F6">Entrega</text>
      <text class="sans" y="70" text-anchor="middle" font-size="11" fill="#B08A98">Docker, CI y pruebas</text>
      <text class="sans" y="88" text-anchor="middle" font-size="11" fill="#8A5F6F">documentación incluida</text>
    </g>

    <g transform="translate(1080 112)">
      <circle r="8" fill="#7EE0A8" class="pulse p4"/>
      <circle r="15" fill="none" stroke="#7EE0A8" stroke-opacity="0.35"/>
      <text class="mono" y="-30" text-anchor="middle" font-size="11" letter-spacing="1.6" fill="#7EE0A8">HOY</text>
      <text class="sans" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF3F6">Siguiente</text>
      <text class="sans" y="70" text-anchor="middle" font-size="11" fill="#B08A98">primera oportunidad</text>
      <text class="sans" y="88" text-anchor="middle" font-size="11" fill="#8A5F6F">prácticas o junior</text>
    </g>

    <line x1="48" y1="284" x2="1152" y2="284" stroke="#4A1024"/>
    <text class="mono" x="48" y="306" font-size="10" fill="#7A5060">Cada etapa dejó algo verificable: un repositorio, una prueba o un despliegue.</text>
    <text class="mono" x="1152" y="306" text-anchor="end" font-size="10" fill="#7A5060">MEDELLÍN · CO</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="328.5" rx="21.25" fill="none" stroke="#7E1030" stroke-opacity="0.6" stroke-width="1.5"/>
</svg>
