        <circle cx="3" cy="26" r="2.6" fill="#B08A98"/><text class="sans" x="14" y="30" font-size="13" fill="#DBAEBE">GitHub Actions</text>
        <circle cx="3" cy="56" r="2.6" fill="#B08A98"/><text class="sans" x="14" y="60" font-size="13" fill="#DBAEBE">Git</text>
        <circle cx="3" cy="86" r="2.6" fill="#B08A98"/><text class="sans" x="14" y="90" font-size="13" fill="#DBAEBE">Linux</text>
        <circle cx="3" cy="116" r="2.6" fill="#B08A98"/><text class="sans" x="14" y="120" font-size="13" fill="#DBAEBE">Nginx</text>
        <circle cx="3" cy="146" r="2.6" fill="#B08A98"/><text class="sans" x="14" y="150" font-size="13" fill="#DBAEBE">Bash</text>
