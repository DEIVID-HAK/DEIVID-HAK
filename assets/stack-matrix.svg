<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-label="Mapa de capacidades de David Velez: backend, datos, frontend y entrega.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080205"/>
      <stop offset="1" stop-color="#1B0610"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0608A"/>
      <stop offset="1" stop-color="#B01E45" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="452" rx="24"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#B01E45" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', 'Inter', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace; }
