        <circle cx="3" cy="26" r="2.6" fill="#E0608A"/><text class="sans" x="14" y="30" font-size="13" fill="#DBAEBE">Node.js + Express</text>
        <circle cx="3" cy="56" r="2.6" fill="#E0608A"/><text class="sans" x="14" y="60" font-size="13" fill="#DBAEBE">Python</text>
        <circle cx="3" cy="86" r="2.6" fill="#E0608A"/><text class="sans" x="14" y="90" font-size="13" fill="#DBAEBE">FastAPI</text>
        <circle cx="3" cy="116" r="2.6" fill="#E0608A"/><text class="sans" x="14" y="120" font-size="13" fill="#DBAEBE">Django</text>
