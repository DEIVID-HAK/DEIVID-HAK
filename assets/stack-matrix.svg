        <circle cx="3" cy="26" r="2.6" fill="#D93363"/><text class="sans" x="14" y="30" font-size="13" fill="#DBAEBE">Vite</text>
        <circle cx="3" cy="56" r="2.6" fill="#D93363"/><text class="sans" x="14" y="60" font-size="13" fill="#DBAEBE">Tailwind CSS</text>
        <circle cx="3" cy="86" r="2.6" fill="#D93363"/><text class="sans" x="14" y="90" font-size="13" fill="#DBAEBE">JavaScript ES6+</text>
        <circle cx="3" cy="116" r="2.6" fill="#D93363"/><text class="sans" x="14" y="120" font-size="13" fill="#DBAEBE">HTML5</text>
        <circle cx="3" cy="146" r="2.6" fill="#D93363"/><text class="sans" x="14" y="150" font-size="13" fill="#DBAEBE">CSS3</text>
