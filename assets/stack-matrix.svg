        <circle cx="3" cy="86" r="2.6" fill="#F6C6D2"/><text class="sans" x="14" y="90" font-size="13" fill="#DBAEBE">SQLite</text>
        <circle cx="3" cy="116" r="2.6" fill="#F6C6D2"/><text class="sans" x="14" y="120" font-size="13" fill="#DBAEBE">MongoDB</text>
        <circle cx="3" cy="146" r="2.6" fill="#F6C6D2"/><text class="sans" x="14" y="150" font-size="13" fill="#DBAEBE">Redis</text>
