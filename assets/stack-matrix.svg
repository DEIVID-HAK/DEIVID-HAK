    <line x1="48" y1="428" x2="1152" y2="428" stroke="#4A1024"/>
    <text class="mono" x="48" y="446" font-size="10" fill="#7A5060">● aplicado en proyectos del perfil</text>
    <text class="mono" x="1152" y="446" text-anchor="end" font-size="10" fill="#7A5060">DAVID VELEZ · 2026</text>
    <rect x="300" y="422" width="600" height="1.5" fill="url(#edge)" opacity="0.6"/>
