<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" role="img" aria-label="Proceso de entrega: entender, modelar, construir, verificar y desplegar.">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#05070B"/>
      <stop offset="0.5" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>

    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.12">
      <stop offset="0" stop-color="#6C7888"/>
      <stop offset="0.14" stop-color="#DCE5EF"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.44" stop-color="#AFBCCB"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#C6D1DE"/>
      <stop offset="0.86" stop-color="#8D99A9"/>
      <stop offset="1" stop-color="#E4EBF4"/>
    </linearGradient>

    <linearGradient id="chromeSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B98A8"/>
      <stop offset="0.5" stop-color="#EDF3FA"/>
      <stop offset="1" stop-color="#9AA6B6"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47535F"/>
      <stop offset="0.22" stop-color="#C8D3E0"/>
      <stop offset="0.45" stop-color="#39434F"/>
      <stop offset="0.68" stop-color="#E9EFF7"/>
      <stop offset="0.88" stop-color="#4A5663"/>
      <stop offset="1" stop-color="#8A96A6"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyanRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79D2FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79D2FF"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E3C98F"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.012"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.028"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#79D2FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="screw" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#F4F8FD"/>
      <stop offset="0.55" stop-color="#8D99A9"/>
      <stop offset="1" stop-color="#2A3340"/>
    </radialGradient>

    <pattern id="brush" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 1.5H7" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="0.7"/>
      <path d="M0 4.5H7" stroke="#FFFFFF" stroke-opacity="0.018" stroke-width="0.7"/>
    </pattern>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8FA4BC" stroke-opacity="0.07"/>
    </pattern>

    <style>
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .pulse-slow { animation: pulse 5s ease-in-out infinite; }
      .flow { stroke-dasharray: 5 11; animation: flow 3s linear infinite; }
      .blink { animation: blink 1.5s steps(1) infinite; }
      .sweep { animation: sweep 9s cubic-bezier(.45,0,.25,1) infinite; }
      .sweep-slow { animation: sweep 12s cubic-bezier(.45,0,.25,1) infinite; }
      .s1 { animation-delay: .5s; } .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 1.7s; }
      .s4 { animation-delay: 2.3s; } .s5 { animation-delay: 2.9s; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes sweep { 0%, 62% { transform: translateX(-520px); } 92%, 100% { transform: translateX(1320px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <clipPath id="clip"><rect width="1200" height="232" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    
  <rect width="1200" height="232" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="232" rx="20" fill="url(#brush)"/>
  <rect width="1200" height="232" rx="20" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="230.5" rx="19.25"
        fill="none" stroke="url(#edge)" stroke-opacity="0.62" stroke-width="1.5"/>
  <rect x="5" y="5" width="1190" height="222" rx="16"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <circle cx="18" cy="18" r="4.2" fill="url(#screw)" opacity="0.8"/>
  <circle cx="1182" cy="18" r="4.2" fill="url(#screw)" opacity="0.8"/>
  <circle cx="18" cy="214" r="4.2" fill="url(#screw)" opacity="0.8"/>
  <circle cx="1182" cy="214" r="4.2" fill="url(#screw)" opacity="0.8"/>
    <text class="mono" x="48" y="44" font-size="10.5" letter-spacing="4" fill="#E3C98F">[ PROCESO DE ENTREGA ]</text>
    <text class="mono" x="1152" y="44" text-anchor="end" font-size="10" fill="#4B5666">el mismo en cada proyecto</text>

    <line x1="128" y1="118" x2="1072" y2="118" stroke="#2A3441" stroke-width="2"/>
    <line x1="128" y1="118" x2="1072" y2="118" stroke="url(#cyanRail)" stroke-width="1.6" class="flow"/>
    <circle r="4" fill="#79D2FF">
      <animateMotion dur="6s" repeatCount="indefinite" path="M128 118 H1072" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    
    <g transform="translate(128 118)">
      <circle r="28" fill="#0B1118" stroke="url(#edge)" stroke-opacity="0.85" stroke-width="1.5"/>
      <circle r="34" fill="none" stroke="#79D2FF" stroke-width="1.2" opacity="0.3" class="pulse s1"/>
      <text class="mono" y="5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#79D2FF">01</text>
      <text class="sans" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E9EFF7">Entender</text>
      <text class="mono" y="82" text-anchor="middle" font-size="9.5" fill="#6E7C8D">requisitos y límites</text>
    </g>
    <g transform="translate(364 118)">
      <circle r="28" fill="#0B1118" stroke="url(#edge)" stroke-opacity="0.85" stroke-width="1.5"/>
      <circle r="34" fill="none" stroke="#79D2FF" stroke-width="1.2" opacity="0.3" class="pulse s2"/>
      <text class="mono" y="5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#79D2FF">02</text>
      <text class="sans" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E9EFF7">Modelar</text>
      <text class="mono" y="82" text-anchor="middle" font-size="9.5" fill="#6E7C8D">datos y contratos</text>
    </g>
    <g transform="translate(600 118)">
      <circle r="28" fill="#0B1118" stroke="url(#edge)" stroke-opacity="0.85" stroke-width="1.5"/>
      <circle r="34" fill="none" stroke="#79D2FF" stroke-width="1.2" opacity="0.3" class="pulse s3"/>
      <text class="mono" y="5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#79D2FF">03</text>
      <text class="sans" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E9EFF7">Construir</text>
      <text class="mono" y="82" text-anchor="middle" font-size="9.5" fill="#6E7C8D">API e interfaz</text>
    </g>
    <g transform="translate(836 118)">
      <circle r="28" fill="#0B1118" stroke="url(#edge)" stroke-opacity="0.85" stroke-width="1.5"/>
      <circle r="34" fill="none" stroke="#79D2FF" stroke-width="1.2" opacity="0.3" class="pulse s4"/>
      <text class="mono" y="5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#79D2FF">04</text>
      <text class="sans" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E9EFF7">Verificar</text>
      <text class="mono" y="82" text-anchor="middle" font-size="9.5" fill="#6E7C8D">pruebas y revisión</text>
    </g>
    <g transform="translate(1072 118)">
      <circle r="28" fill="#0B1118" stroke="url(#edge)" stroke-opacity="0.85" stroke-width="1.5"/>
      <circle r="34" fill="none" stroke="#79D2FF" stroke-width="1.2" opacity="0.3" class="pulse s5"/>
      <text class="mono" y="5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#79D2FF">05</text>
      <text class="sans" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E9EFF7">Desplegar</text>
      <text class="mono" y="82" text-anchor="middle" font-size="9.5" fill="#6E7C8D">contenedor y CI</text>
    </g>
    
  <g clip-path="url(#clip)" transform="rotate(-16 600 116)">
    <rect class="sweep-slow" x="-300" y="-160" width="230" height="572" fill="url(#sheen)"/>
  </g>
  </g>
</svg>
