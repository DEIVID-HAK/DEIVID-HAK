<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="David Velez, desarrollador full stack. Backend, APIs y datos, de Medellín, Colombia.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080205"/>
      <stop offset="0.55" stop-color="#12040A"/>
      <stop offset="1" stop-color="#1E0610"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#FFE7ED"/>
      <stop offset="1" stop-color="#E0608A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#B01E45" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0608A"/>
      <stop offset="1" stop-color="#B01E45" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#B01E45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#B01E45" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="400" rx="24"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Inter', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace; }
      .pulse { animation: pulse 3.4s ease-in-out infinite; }
      .d1 { animation-delay: .2s; }
      .d2 { animation-delay: .7s; }
      .d3 { animation-delay: 1.2s; }
      .d4 { animation-delay: 1.7s; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      .flow { stroke-dasharray: 6 12; animation: flow 2.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      .cursor { animation: blink 1.6s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <ellipse cx="120" cy="80" rx="340" ry="220" fill="url(#glow)" opacity="0.7"/>
    <ellipse cx="1060" cy="330" rx="300" ry="200" fill="url(#glow)" opacity="0.5"/>

    <rect width="1200" height="44" fill="#16050C" opacity="0.86"/>
    <circle cx="28" cy="22" r="5" fill="#E0608A"/>
    <circle cx="46" cy="22" r="5" fill="#B01E45"/>
    <circle cx="64" cy="22" r="5" fill="#5A1230"/>
    <text class="mono" x="88" y="27" font-size="12" fill="#B08A98">david@medellin:~/profile</text>
    <text class="mono" x="1148" y="27" text-anchor="end" font-size="11" fill="#8A5F6F">es-CO · UTC-5</text>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#B01E45" stroke-opacity="0.35"/>

    <text class="mono" x="56" y="98" font-size="12" letter-spacing="4" fill="#E0608A">[ FULL STACK DEVELOPER ]</text>
    <text class="sans" x="52" y="176" font-size="66" font-weight="800" letter-spacing="-1.6" fill="url(#title)">DAVID VELEZ</text>
    <text class="sans" x="56" y="214" font-size="19" fill="#F6C6D2">Backend, APIs y datos. Del esquema a la interfaz.</text>
    <text class="sans" x="56" y="242" font-size="13.5" fill="#B08A98">ADSO · SENA Medellín · 6.º semestre · construyendo mi primera oportunidad profesional.</text>

    <g transform="translate(56 268)">
      <rect width="142" height="30" rx="15" fill="#2A0A14" stroke="#B01E45" stroke-opacity="0.65"/>
      <circle cx="18" cy="15" r="4" fill="#7EE0A8" class="pulse"/>
      <text class="mono" x="30" y="19" font-size="10.5" letter-spacing="0.6" fill="#F6C6D2">OPEN TO WORK</text>

      <g transform="translate(154 0)">
        <rect width="190" height="30" rx="15" fill="#2A0A14" stroke="#4A1024"/>
        <text class="mono" x="16" y="19" font-size="10.5" letter-spacing="0.6" fill="#B08A98">ADSO · SENA · 6.º SEM</text>
      </g>

      <g transform="translate(356 0)">
        <rect width="168" height="30" rx="15" fill="#2A0A14" stroke="#4A1024"/>
        <text class="mono" x="16" y="19" font-size="10.5" letter-spacing="0.6" fill="#B08A98">MEDELLÍN · CO</text>
      </g>
    </g>

    <text class="mono" x="56" y="352" font-size="13" fill="#8A5F6F">// software que se puede explicar, probar y desplegar.</text>

    <g transform="translate(748 84)">
      <rect width="404" height="244" rx="18" fill="url(#card)" stroke="#7E1030" stroke-opacity="0.7"/>
      <rect x="0" y="0" width="404" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>

      <text class="mono" x="24" y="34" font-size="10.5" letter-spacing="2.6" fill="#E0608A">REQUEST LIFECYCLE</text>
      <text class="mono" x="380" y="34" text-anchor="end" font-size="10" fill="#7A5060">v2026.11</text>

      <line x1="31" y1="70" x2="31" y2="199" stroke="#B01E45" stroke-width="1.6" stroke-opacity="0.55" class="flow"/>

      <g transform="translate(0 58)">
        <circle cx="31" cy="12" r="9" fill="#2A0A14" stroke="#E0608A" stroke-width="1.6"/>
        <circle cx="31" cy="12" r="3.2" fill="#E0608A" class="pulse"/>
        <text class="sans" x="54" y="10" font-size="13" font-weight="700" fill="#FFF3F6">INTERFAZ</text>
        <text class="mono" x="54" y="26" font-size="10.5" fill="#9C7282">React · Vite · Tailwind</text>
        <text class="mono" x="380" y="17" text-anchor="end" font-size="10" fill="#7EE0A8">200 OK</text>
      </g>

      <g transform="translate(0 101)">
        <circle cx="31" cy="12" r="9" fill="#2A0A14" stroke="#E0608A" stroke-width="1.6"/>
        <circle cx="31" cy="12" r="3.2" fill="#E0608A" class="pulse d1"/>
        <text class="sans" x="54" y="10" font-size="13" font-weight="700" fill="#FFF3F6">API</text>
        <text class="mono" x="54" y="26" font-size="10.5" fill="#9C7282">Java · Node · FastAPI</text>
        <text class="mono" x="380" y="17" text-anchor="end" font-size="10" fill="#7EE0A8">200 OK</text>
      </g>

      <g transform="translate(0 144)">
        <circle cx="31" cy="12" r="9" fill="#2A0A14" stroke="#E0608A" stroke-width="1.6"/>
        <circle cx="31" cy="12" r="3.2" fill="#E0608A" class="pulse d2"/>
        <text class="sans" x="54" y="10" font-size="13" font-weight="700" fill="#FFF3F6">DATOS</text>
        <text class="mono" x="54" y="26" font-size="10.5" fill="#9C7282">PostgreSQL · PostGIS · SQLite</text>
        <text class="mono" x="380" y="17" text-anchor="end" font-size="10" fill="#7EE0A8">200 OK</text>
      </g>

      <g transform="translate(0 187)">
        <circle cx="31" cy="12" r="9" fill="#2A0A14" stroke="#E0608A" stroke-width="1.6"/>
        <circle cx="31" cy="12" r="3.2" fill="#E0608A" class="pulse d3"/>
        <text class="sans" x="54" y="10" font-size="13" font-weight="700" fill="#FFF3F6">ENTREGA</text>
        <text class="mono" x="54" y="26" font-size="10.5" fill="#9C7282">Docker · Actions · Nginx</text>
        <text class="mono" x="380" y="17" text-anchor="end" font-size="10" fill="#7EE0A8">200 OK</text>
      </g>

      <line x1="24" y1="222" x2="380" y2="222" stroke="#4A1024"/>
      <text class="mono" x="24" y="238" font-size="10.5" fill="#8A5F6F">$ deploy --target production</text>
      <rect class="cursor" x="238" y="228" width="7" height="12" fill="#E0608A" opacity="0.8"/>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="23.25" fill="none" stroke="#7E1030" stroke-opacity="0.65" stroke-width="1.5"/>
</svg>
