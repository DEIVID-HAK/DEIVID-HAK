<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Átomos animados">
  <title>Átomos animados</title>
  <defs>
    <linearGradient id="atomLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0608A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B01E45" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="atomGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#B01E45" stop-opacity="0"/>
    </radialGradient>

    <g id="atom">
      <circle r="52" fill="url(#atomGlow)"/>
      <g fill="none" stroke="#E0608A" stroke-width="1.6">
        <ellipse rx="42" ry="16" stroke-opacity="0.9"/>
        <ellipse rx="42" ry="16" transform="rotate(60)" stroke-opacity="0.55"/>
        <ellipse rx="42" ry="16" transform="rotate(120)" stroke-opacity="0.7"/>
      </g>
      <circle r="10" fill="#B01E45" opacity="0.35"/>
      <circle r="5" fill="#B01E45"/>
      <circle r="2.3" fill="#FFE7ED"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        <circle cx="42" cy="0" r="2.8" fill="#FFE7ED"/>
      </g>
      <g transform="rotate(60)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
          <circle cx="42" cy="0" r="2.3" fill="#E0608A"/>
        </g>
      </g>
      <g transform="rotate(120)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="13s" repeatCount="indefinite"/>
          <circle cx="42" cy="0" r="1.9" fill="#FFE7ED" opacity="0.85"/>
        </g>
      </g>
      <circle r="10" fill="none" stroke="#E0608A" stroke-opacity="0.55">
        <animate attributeName="r" values="8;18;8" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="3.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </defs>

  <line x1="40" y1="48" x2="1160" y2="48" stroke="url(#atomLine)" stroke-width="1.2" stroke-dasharray="3 10"/>
  <circle cx="240" cy="48" r="1.6" fill="#E0608A" opacity="0.55"/>
  <circle cx="470" cy="48" r="1.4" fill="#FFE7ED" opacity="0.5"/>
  <circle cx="730" cy="48" r="1.6" fill="#E0608A" opacity="0.55"/>
  <circle cx="960" cy="48" r="1.4" fill="#FFE7ED" opacity="0.5"/>

  <use href="#atom" transform="translate(120 48) scale(0.62)" opacity="0.85"/>
  <use href="#atom" transform="translate(330 48) scale(0.38)" opacity="0.7"/>
  <use href="#atom" transform="translate(600 48) scale(0.85)"/>
  <use href="#atom" transform="translate(870 48) scale(0.42)" opacity="0.75"/>
  <use href="#atom" transform="translate(1080 48) scale(0.6)" opacity="0.85"/>
</svg>
