<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76" role="img" aria-label="David Velez 2026">
  <defs>
    <style>
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1000" height="76" rx="14" fill="#120409"/>
  <g transform="translate(925.0 37.0) scale(1.058)" opacity="0.22">
      <g fill="none" stroke="#E0608A" stroke-width="1.6">
        <ellipse rx="46" ry="17"/>
        <ellipse rx="46" ry="17" transform="rotate(60)"/>
        <ellipse rx="46" ry="17" transform="rotate(120)"/>
      </g>
      <circle r="7" fill="#E0608A" fill-opacity="0.8"/>
      <circle r="3" fill="#FFE7ED"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/><circle cx="46" cy="0" r="3.2" fill="#FFE7ED"/></g>
      <g transform="rotate(60)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/><circle cx="46" cy="0" r="2.8" fill="#E0608A"/></g></g>
      <g transform="rotate(120)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="15s" repeatCount="indefinite"/><circle cx="46" cy="0" r="2.4" fill="#FFE7ED"/></g></g>
    </g>
  <rect width="1000" height="76" rx="14" fill="none" stroke="#5A1230" stroke-width="2"/>

  <text x="500" y="32" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#B08A98">Daviid Vlez · ADSO Technologist · Medellín, Colombia · 2026<tspan class="blink" fill="#B01E45">_</tspan></text>

  <g transform="translate(440,50)">
    <rect class="pulse" x="0" y="0" width="10" height="10" rx="2" fill="#B01E45" style="animation-delay:0s"/>
    <rect class="pulse" x="20" y="0" width="10" height="10" rx="2" fill="#E0608A" style="animation-delay:0.15s"/>
    <rect class="pulse" x="40" y="0" width="10" height="10" rx="2" fill="#E0A64A" style="animation-delay:0.3s"/>
    <rect class="pulse" x="60" y="0" width="10" height="10" rx="2" fill="#EBC07A" style="animation-delay:0.45s"/>
    <rect class="pulse" x="80" y="0" width="10" height="10" rx="2" fill="#D9527A" style="animation-delay:0.6s"/>
    <rect class="pulse" x="100" y="0" width="10" height="10" rx="2" fill="#E8839F" style="animation-delay:0.75s"/>
    <rect class="pulse" x="120" y="0" width="10" height="10" rx="2" fill="#E0608A" style="animation-delay:0.9s"/>
    <rect class="pulse" x="140" y="0" width="10" height="10" rx="2" fill="#B01E45" style="animation-delay:1.05s"/>
    <rect class="pulse" x="160" y="0" width="10" height="10" rx="2" fill="#E0A64A" style="animation-delay:1.2s"/>
    <rect class="pulse" x="180" y="0" width="10" height="10" rx="2" fill="#D9527A" style="animation-delay:1.35s"/>
    <rect class="pulse" x="200" y="0" width="10" height="10" rx="2" fill="#7E1030" style="animation-delay:1.5s"/>
    <rect class="pulse" x="220" y="0" width="10" height="10" rx="2" fill="#B01E45" style="animation-delay:1.65s"/>
  </g>
</svg>
