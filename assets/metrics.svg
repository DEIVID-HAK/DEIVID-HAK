    <pattern id="brush" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 1.5H7" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="0.7"/>
      <path d="M0 4.5H7" stroke="#FFFFFF" stroke-opacity="0.018" stroke-width="0.7"/>
    </pattern>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8FA4BC" stroke-opacity="0.07"/>
    </pattern>

    <style>
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .pulse-slow { animation: pulse 5s ease-in-out infinite; }
      .flow { stroke-dasharray: 5 11; animation: flow 3s linear infinite; }
      .blink { animation: blink 1.5s steps(1) infinite; }
      .sweep { animation: sweep 9s cubic-bezier(.45,0,.25,1) infinite; }
      .sweep-slow { animation: sweep 12s cubic-bezier(.45,0,.25,1) infinite; }
      .gold-run { animation-name: goldrun; animation-timing-function: linear; animation-iteration-count: infinite; animation-duration: 16s; }
      .gold-halo { animation: goldpulse 7s ease-in-out infinite; }
      .s1 { animation-delay: .5s; } .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 1.7s; }
      .s4 { animation-delay: 2.3s; } .s5 { animation-delay: 2.9s; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes sweep { 0%, 62% { transform: translateX(-520px); } 92%, 100% { transform: translateX(1320px); } }
      @keyframes goldrun { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
      @keyframes goldpulse { 0%, 100% { opacity: .2; } 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <clipPath id="clip"><rect width="1200" height="132" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    
  <rect width="1200" height="132" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="132" rx="16" fill="url(#brush)"/>
  <rect width="1200" height="132" rx="16" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="130.5" rx="15.25"
        fill="none" stroke="url(#edge)" stroke-opacity="0.62" stroke-width="1.5"/>
  <rect x="5" y="5" width="1190" height="122" rx="12"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
  
  <rect x="3.25" y="3.25" width="1193.5" height="125.5" rx="12.75" fill="none" stroke="url(#goldEdge)" stroke-opacity="0.5" stroke-width="1"/>
  <rect class="gold-halo" x="3.25" y="3.25" width="1193.5" height="125.5" rx="12.75" fill="none" stroke="#E3C98F" stroke-width="5" stroke-opacity="0.2"/>
  <rect class="gold-run" x="3.25" y="3.25" width="1193.5" height="125.5" rx="12.75" fill="none" pathLength="100" stroke="url(#goldTrail)" stroke-width="3.9000000000000004" stroke-opacity="0.22" stroke-linecap="round" stroke-dasharray="9 91" style="animation-duration:18s"/><rect class="gold-run" x="3.25" y="3.25" width="1193.5" height="125.5" rx="12.75" fill="none" pathLength="100" stroke="url(#goldTrail)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="9 91" style="animation-duration:18s"/><rect class="gold-run" x="3.25" y="3.25" width="1193.5" height="125.5" rx="12.75" fill="none" pathLength="100" stroke="#FFF3D6" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1.5 98.5" style="animation-duration:18s;animation-delay:-9.0s"/>
  
    
    <text class="sans" x="150" y="62" text-anchor="middle" font-size="34" font-weight="800" letter-spacing="-1" fill="url(#chrome)">04</text>
    <text class="mono" x="150" y="86" text-anchor="middle" font-size="9.5" letter-spacing="1.8" fill="#79D2FF">SISTEMAS ENTREGADOS</text>
    <text class="mono" x="150" y="104" text-anchor="middle" font-size="8.5" fill="#4B5666">de la idea al despliegue</text>
    <line x1="300" y1="34" x2="300" y2="100" stroke="#1B232D"/>
    <text class="sans" x="450" y="62" text-anchor="middle" font-size="34" font-weight="800" letter-spacing="-1" fill="url(#chrome)">46</text>
    <text class="mono" x="450" y="86" text-anchor="middle" font-size="9.5" letter-spacing="1.8" fill="#79D2FF">PRUEBAS AUTOMATIZADAS</text>
    <text class="mono" x="450" y="104" text-anchor="middle" font-size="8.5" fill="#4B5666">en el e-commerce textil</text>
    <line x1="600" y1="34" x2="600" y2="100" stroke="#1B232D"/>
    <text class="sans" x="750" y="62" text-anchor="middle" font-size="34" font-weight="800" letter-spacing="-1" fill="url(#chrome)">702.540</text>
    <text class="mono" x="750" y="86" text-anchor="middle" font-size="9.5" letter-spacing="1.8" fill="#79D2FF">REGISTROS GEOESPACIALES</text>
    <text class="mono" x="750" y="104" text-anchor="middle" font-size="8.5" fill="#4B5666">cargados y consultables</text>
    <line x1="900" y1="34" x2="900" y2="100" stroke="#1B232D"/>
    <text class="sans" x="1050" y="62" text-anchor="middle" font-size="34" font-weight="800" letter-spacing="-1" fill="url(#chrome)">25</text>
    <text class="mono" x="1050" y="86" text-anchor="middle" font-size="9.5" letter-spacing="1.8" fill="#79D2FF">TABLAS MODELADAS</text>
    <text class="mono" x="1050" y="104" text-anchor="middle" font-size="8.5" fill="#4B5666">con 20 llaves foráneas</text>
    
    
  <g clip-path="url(#clip)" transform="rotate(-16 600 66)">
    <rect class="sweep-slow" x="-300" y="-160" width="230" height="472" fill="url(#sheen)"/>
  </g>
  </g>
