<svg xmlns="http://www.w3.org/2000/svg" width="470" height="190" viewBox="0 0 470 190" role="img" aria-label="Proyecto D&amp;D Textil E-commerce">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B01E45"/>
      <stop offset="1" stop-color="#7E1030"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0608A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0608A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E0608A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="470" height="190" rx="14"/></clipPath>
    <style>
      .shine { animation: sweep 4s linear infinite; }
      @keyframes sweep { from { transform: translateX(-150px); } to { transform: translateX(470px); } }
    </style>
  </defs>
  <rect width="470" height="190" rx="14" fill="#180509"/>
  <g transform="translate(405.0 90.0) scale(1.442)" opacity="0.22">
      <g fill="none" stroke="#E0608A" stroke-width="1.6">
        <ellipse rx="46" ry="17"/>
        <ellipse rx="46" ry="17" transform="rotate(60)"/>
        <ellipse rx="46" ry="17" transform="rotate(120)"/>
      </g>
      <circle r="7" fill="#E0608A" fill-opacity="0.8"/>
      <circle r="3" fill="#FFE7ED"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/><circle cx="46" cy="0" r="3.2" fill="#FFE7ED"/></g>
      <g transform="rotate(60)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/><circle cx="46" cy="0" r="2.8" fill="#E0608A"/></g></g>
      <g transform="rotate(120)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="15s" repeatCount="indefinite"/><circle cx="46" cy="0" r="2.4" fill="#FFE7ED"/></g></g>
    </g>
  <rect width="470" height="190" rx="14" fill="none" stroke="url(#g)" stroke-width="1.5"/>
  <g clip-path="url(#clip)"><rect class="shine" x="0" y="0" width="150" height="3" fill="url(#shine)"/></g>

  <rect x="24" y="24" width="52" height="52" rx="14" fill="#2A0A14" stroke="#B01E45" stroke-opacity="0.6"/>
  <text x="50" y="57" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#E0608A">D&amp;D</text>
  <text x="92" y="47" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFF3F6">D&amp;D Textil — E-commerce</text>
  <text x="92" y="70" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#B08A98">PROYECTO-SENA-TIENDA-TEXTIL</text>

  <text x="24" y="114" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#DBAEBE">Venta de textiles por metros con inventario,</text>
  <text x="24" y="134" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#DBAEBE">pedidos y gestión administrativa en BD.</text>

  <rect x="24" y="152" width="82" height="24" rx="12" fill="#2A0A14" stroke="#4A1024"/>
  <text x="65" y="168" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#B08A98">JavaScript</text>
  <rect x="114" y="152" width="52" height="24" rx="12" fill="#2A0A14" stroke="#4A1024"/>
  <text x="140" y="168" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#B08A98">React</text>
  <rect x="174" y="152" width="52" height="24" rx="12" fill="#2A0A14" stroke="#4A1024"/>
  <text x="200" y="168" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#B08A98">MySQL</text>
</svg>
