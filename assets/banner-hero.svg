<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="David Velez - ADSO Technologist and Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120409"/>
      <stop offset="0.55" stop-color="#1E0710"/>
      <stop offset="1" stop-color="#2B0817"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#FFE7ED"/>
      <stop offset="1" stop-color="#E0608A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B01E45"/>
      <stop offset="1" stop-color="#7E1030" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D0F21"/>
      <stop offset="1" stop-color="#260814"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B01E45"/>
      <stop offset="0.5" stop-color="#FFE7ED"/>
      <stop offset="1" stop-color="#7E1030"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#5A1230" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .in{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}.d5{animation-delay:1.1s}
      @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .orb1{animation:drift1 14s ease-in-out infinite alternate}
      .orb2{animation:drift2 18s ease-in-out infinite alternate}
      @keyframes drift1{to{transform:translate(90px,40px)}}
      @keyframes drift2{to{transform:translate(-120px,-30px)}}
      .flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
      @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 20s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .twinkle{animation:twinkle 3s ease-in-out infinite}
      .twinkle2{animation:twinkle 3s ease-in-out infinite 1.2s}
      @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
      .typing{animation:up .8s cubic-bezier(.2,.7,.2,1) 1.15s backwards,type 2.8s steps(44) 1.35s both}
      @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
      .bob1,.bob2,.bob3,.bob4{transform-box:fill-box;transform-origin:center;animation:bob 5.5s ease-in-out infinite alternate}
      .bob2{animation-delay:-1.4s}.bob3{animation-delay:-2.8s}.bob4{animation-delay:-4.1s}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
      .scan{animation:scan 9s linear infinite}
      @keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(390px)}}
      .fadein{animation:fade .9s ease 1s backwards}
      @keyframes fade{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: reduce){
        .in,.typing,.fadein,.scan,.bob1,.bob2,.bob3,.bob4,.flow,.pulse,.spin,.twinkle,.twinkle2{animation:none!important;opacity:1!important;clip-path:none!important}
      }
    </style>
    <clipPath id="bannerClip"><rect width="1200" height="360" rx="22"/></clipPath>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0608A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0608A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFE7ED" stop-opacity="0"/>
    </linearGradient>  </defs>

  <!-- fondo -->
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle class="orb1" cx="260" cy="70" r="150" fill="#7E1030" opacity="0.35" filter="url(#blur)"/>
  <circle class="orb2" cx="980" cy="300" r="170" fill="#B01E45" opacity="0.22" filter="url(#blur)"/>

  <g clip-path="url(#bannerClip)">
    <rect class="scan" x="0" y="-90" width="1200" height="90" fill="url(#scanGrad)" opacity="0.8"/>
  </g>

  <!-- estrellas -->
  <circle class="twinkle" cx="880" cy="52" r="2" fill="#FFE7ED"/>
  <circle class="twinkle2" cx="1120" cy="82" r="1.6" fill="#F6C6D2"/>
  <circle class="twinkle2" cx="612" cy="300" r="1.4" fill="#FFE7ED"/>
  <circle class="twinkle" cx="758" cy="36" r="1.2" fill="#E0608A"/>
  <circle class="twinkle" cx="1040" cy="34" r="1.3" fill="#FFE7ED"/>
  <circle class="twinkle2" cx="540" cy="42" r="1.8" fill="#F6C6D2"/>
  <circle class="twinkle" cx="700" cy="318" r="1.5" fill="#E0608A"/>
  <circle class="twinkle2" cx="820" cy="340" r="1.2" fill="#FFE7ED"/>
  <circle class="twinkle" cx="460" cy="112" r="1.4" fill="#F6C6D2"/>
  <circle class="twinkle2" cx="1180" cy="250" r="1.7" fill="#FFE7ED"/>
  <circle class="twinkle" cx="880" cy="52" r="2" fill="#FFE7ED"/>
  <circle class="twinkle2" cx="1120" cy="82" r="1.6" fill="#F6C6D2"/>
  <circle class="twinkle2" cx="612" cy="300" r="1.4" fill="#FFE7ED"/>
  <circle class="twinkle" cx="758" cy="36" r="1.2" fill="#E0608A"/>

  <!-- texto -->
  <g class="mono in d1">
    <rect x="64" y="58" width="252" height="30" rx="15" fill="#B01E45" fill-opacity="0.12" stroke="#B01E45" stroke-opacity="0.5"/>
    <circle cx="84" cy="73" r="4.5" fill="#E0A64A"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="98" y="78" font-size="14" fill="#F6C6D2">open to work · Medellín, CO</text>
  </g>

  <g class="in d2">
    <text x="62" y="152" class="sans" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="-1.5">DAVID VELEZ<tspan fill="#B01E45" font-weight="400">_<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <g class="in d3">
    <text x="64" y="194" class="sans" font-size="23" font-weight="600" fill="#F8E8ED">ADSO Technologist <tspan fill="#B01E45">·</tspan> Full Stack Developer</text>
    <rect x="64" y="210" width="360" height="3" rx="1.5" fill="url(#line)"/>
  </g>

  <g class="mono typing" font-size="15">
    <text x="64" y="246" fill="#B58D9B"><tspan fill="#B01E45">const</tspan> stack <tspan fill="#B01E45">=</tspan> <tspan fill="#ffd166">"Java · React · PostgreSQL"</tspan>;</text>
  </g>

  <rect x="470" y="234" width="2" height="15" fill="#E0608A" class="cursor"/>
  <g class="mono in d5" font-size="13" font-weight="600">
    <g transform="translate(64 272)">
      <rect width="78" height="30" rx="8" fill="#ed8b00" fill-opacity="0.14" stroke="#ed8b00" stroke-opacity="0.6"/>
      <text x="39" y="20" text-anchor="middle" fill="#ffb454">Java</text>
    </g>
    <g transform="translate(152 272)">
      <rect width="90" height="30" rx="8" fill="#E0608A" fill-opacity="0.1" stroke="#E0608A" stroke-opacity="0.55"/>
      <text x="45" y="20" text-anchor="middle" fill="#FFD9E3">React</text>
    </g>
    <g transform="translate(252 272)">
      <rect width="122" height="30" rx="8" fill="#8C2A4E" fill-opacity="0.16" stroke="#C4688A" stroke-opacity="0.7"/>
      <text x="61" y="20" text-anchor="middle" fill="#F3BACB">PostgreSQL</text>
    </g>
    <g transform="translate(384 272)">
      <rect width="88" height="30" rx="8" fill="#B01E45" fill-opacity="0.14" stroke="#B01E45" stroke-opacity="0.6"/>
      <text x="44" y="20" text-anchor="middle" fill="#F2B8C9">Docker</text>
    </g>
  </g>

  <g class="in d5">
    <text x="64" y="314" class="mono" font-size="8.5" fill="#8A5566" letter-spacing="1.4">DEPLOY PIPELINE</text>
    <line x1="72" y1="330" x2="426" y2="330" stroke="#5A1230" stroke-width="2"/>
    <line x1="72" y1="330" x2="426" y2="330" stroke="#B01E45" stroke-width="2" class="flow" opacity="0.7"/>
    <circle r="3.5" fill="#FFE7ED" filter="url(#glow)"><animateMotion dur="3.2s" repeatCount="indefinite" path="M72 330 L426 330"/></circle>
    <g>
      <circle cx="72" cy="330" r="9" fill="none" stroke="#5A1230"/>
      <circle cx="72" cy="330" r="4.5" fill="#B01E45"/>
      <circle cx="190" cy="330" r="9" fill="none" stroke="#5A1230"/>
      <circle cx="190" cy="330" r="4.5" fill="#B01E45"/>
      <circle cx="308" cy="330" r="9" fill="none" stroke="#5A1230"/>
      <circle cx="308" cy="330" r="4.5" fill="#B01E45"/>
      <circle cx="426" cy="330" r="9" fill="none" stroke="#E0A64A" stroke-opacity="0.6"/>
      <circle cx="426" cy="330" r="4.5" fill="#E0A64A"/>
    </g>
    <text x="72" y="352" text-anchor="middle" class="mono" font-size="9.5" fill="#A86C80">git</text>
    <text x="190" y="352" text-anchor="middle" class="mono" font-size="9.5" fill="#A86C80">build</text>
    <text x="308" y="352" text-anchor="middle" class="mono" font-size="9.5" fill="#A86C80">test</text>
    <text x="426" y="352" text-anchor="middle" class="mono" font-size="9.5" fill="#E0A64A">deploy</text>
  </g>

  <!-- diagrama full stack animado -->
  <g class="in d3">
    <!-- conexiones -->
    <path id="p1" d="M842 96 C 900 96, 900 180, 958 180" fill="none" stroke="#6B1733" stroke-width="2"/>
    <path id="p2" d="M842 264 C 900 264, 900 180, 958 180" fill="none" stroke="#6B1733" stroke-width="2"/>
    <path d="M842 96 C 900 96, 900 180, 958 180" fill="none" stroke="#B01E45" stroke-width="2" class="flow" opacity="0.8"/>
    <path d="M842 264 C 900 264, 900 180, 958 180" fill="none" stroke="#E0608A" stroke-width="2" class="flow" opacity="0.8"/>

    <!-- paquetes de datos -->
    <circle r="4.5" fill="#FFE7ED" filter="url(#glow)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4.5" fill="#FFE7ED" filter="url(#glow)"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#p2"/></animateMotion></circle>

    <!-- nodo frontend -->
    <g transform="translate(640 62)">
      <rect width="202" height="68" rx="14" fill="url(#node)" stroke="#7C1C3A"/>
      <rect x="14" y="16" width="36" height="36" rx="10" fill="#E0608A" fill-opacity="0.15"/>
      <g transform="translate(32 34)" fill="none" stroke="#E0608A" stroke-width="1.6">
        <ellipse rx="13" ry="5"/><ellipse rx="13" ry="5" transform="rotate(60)"/><ellipse rx="13" ry="5" transform="rotate(120)"/>
        <circle r="2" fill="#E0608A" stroke="none"/>
      </g>
      <text x="62" y="31" class="sans" font-size="15" font-weight="700" fill="#F8E8ED">Frontend</text>
      <text x="62" y="51" class="mono" font-size="12" fill="#EB8FAC">React · Tailwind</text>
    </g>

    <!-- nodo base de datos -->
    <g transform="translate(640 230)">
      <rect width="202" height="68" rx="14" fill="url(#node)" stroke="#7C1C3A"/>
      <rect x="14" y="16" width="36" height="36" rx="10" fill="#8C2A4E" fill-opacity="0.2"/>
      <g transform="translate(32 25)" fill="none" stroke="#F3BACB" stroke-width="1.6">
        <ellipse cx="0" cy="0" rx="10" ry="4"/>
        <path d="M-10 0 V16 C-10 21, 10 21, 10 16 V0"/>
        <path d="M-10 8 C-10 13, 10 13, 10 8"/>
      </g>
      <text x="62" y="31" class="sans" font-size="15" font-weight="700" fill="#F8E8ED">Database</text>
      <text x="62" y="51" class="mono" font-size="12" fill="#F3BACB">PostgreSQL · MySQL</text>
    </g>

    <!-- nodo API -->
    <g transform="translate(958 136)">
      <circle class="pulse" cx="52" cy="44" r="44" fill="none" stroke="#B01E45" stroke-width="2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 95 44" to="360 95 44" dur="18s" repeatCount="indefinite"/>
        <circle cx="95" cy="44" r="62" fill="none" stroke="#E0608A" stroke-width="1" stroke-dasharray="2 10" opacity="0.55"/>
        <circle cx="157" cy="44" r="2.5" fill="#FFE7ED" filter="url(#glow)"/>
      </g>
      <rect width="190" height="88" rx="16" fill="url(#node)" stroke="#B01E45" stroke-opacity="0.8"/>
      <text x="22" y="34" class="mono" font-size="13" fill="#B01E45">{ API REST }</text>
      <text x="22" y="58" class="sans" font-size="16" font-weight="700" fill="#ffffff">Node.js</text>
      <text x="22" y="76" class="mono" font-size="12" fill="#B58D9B">Express · Django</text>
    </g>
  </g>

  <g transform="translate(516 70)" class="fadein">
    <g class="bob1">
      <rect width="96" height="28" rx="8" fill="#f7df1e" fill-opacity="0.08" stroke="#f7df1e" stroke-opacity="0.45"/>
      <text x="48" y="19" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#ffe97a">JavaScript</text>
    </g>
  </g>
  <g transform="translate(880 34)" class="fadein">
    <g class="bob2">
      <rect width="84" height="28" rx="8" fill="#A32A47" fill-opacity="0.12" stroke="#A32A47" stroke-opacity="0.55"/>
      <text x="42" y="19" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#7fe0d8">FastAPI</text>
    </g>
  </g>
  <g transform="translate(520 250)" class="fadein">
    <g class="bob3">
      <rect width="96" height="28" rx="8" fill="#C98A2E" fill-opacity="0.12" stroke="#C98A2E" stroke-opacity="0.55"/>
      <text x="48" y="19" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#F0CE95">MongoDB</text>
    </g>
  </g>
  <g transform="translate(872 306)" class="fadein">
    <g class="bob4">
      <rect width="80" height="28" rx="8" fill="#B04566" fill-opacity="0.14" stroke="#B04566" stroke-opacity="0.6"/>
      <text x="40" y="19" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#F2BCCB">Python</text>
    </g>
  </g>

  <!-- átomo animado (reemplaza la mascota mapache / UBUNTU) -->
  <g class="in d5">
    <g transform="translate(1094 286)">
      <circle r="66" fill="#B01E45" opacity="0.16" filter="url(#blur)"/>
      <circle r="54" fill="none" stroke="#5A1230" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.9"/>
      <g fill="none" stroke="#E0608A" stroke-width="1.5">
        <ellipse rx="56" ry="21" stroke-opacity="0.85"/>
        <g transform="rotate(60)"><ellipse rx="56" ry="21" stroke-opacity="0.55"/></g>
        <g transform="rotate(120)"><ellipse rx="56" ry="21" stroke-opacity="0.7"/></g>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
        <circle cx="56" cy="0" r="3.4" fill="#FFE7ED" filter="url(#glow)"/>
      </g>
      <g transform="rotate(60)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9.5s" repeatCount="indefinite"/>
          <circle cx="56" cy="0" r="3" fill="#E0608A" filter="url(#glow)"/>
        </g>
      </g>
      <g transform="rotate(120)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="12s" repeatCount="indefinite"/>
          <circle cx="56" cy="0" r="2.6" fill="#FFE7ED" opacity="0.9"/>
        </g>
      </g>
      <circle r="12" fill="#B01E45" opacity="0.35"/>
      <circle r="6.5" fill="#B01E45"/>
      <circle r="3" fill="#FFE7ED"/>
      <circle r="10" fill="none" stroke="#E0608A" stroke-opacity="0.6">
        <animate attributeName="r" values="9;18;9" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g opacity="0.5">
    <g transform="translate(474 40)">
      <g fill="none" stroke="#E0608A" stroke-width="1">
        <ellipse rx="15" ry="5.5"/>
        <ellipse rx="15" ry="5.5" transform="rotate(60)"/>
        <ellipse rx="15" ry="5.5" transform="rotate(120)"/>
      </g>
      <circle r="1.6" fill="#FFE7ED"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/><circle cx="15" cy="0" r="1.3" fill="#FFE7ED"/></g>
    </g>
    <g transform="translate(1172 30)">
      <g fill="none" stroke="#E0608A" stroke-width="1">
        <ellipse rx="11" ry="4"/>
        <ellipse rx="11" ry="4" transform="rotate(60)"/>
        <ellipse rx="11" ry="4" transform="rotate(120)"/>
      </g>
      <circle r="1.2" fill="#FFE7ED"/>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/><circle cx="11" cy="0" r="1" fill="#E0608A"/></g>
    </g>
  </g>
</svg>
