<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="David Velez - Full Stack Developer. An hourglass with frontend, backend and database sand.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0206"/>
      <stop offset="0.55" stop-color="#15050C"/>
      <stop offset="1" stop-color="#22060E"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFE7ED"/>
      <stop offset="1" stop-color="#E0608A"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E0608A" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#B01E45" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#B01E45" stop-opacity="0.12"/>
    </linearGradient>

    <radialGradient id="sandGrad" gradientUnits="userSpaceOnUse" cx="950" cy="180" r="175">
      <stop offset="0" stop-color="#FF7FA2"/>
      <stop offset="0.3" stop-color="#D93363"/>
      <stop offset="0.62" stop-color="#A81F47"/>
      <stop offset="0.85" stop-color="#7E1030"/>
      <stop offset="1" stop-color="#5A0C22"/>
    </radialGradient>

    <radialGradient id="haloGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#8E1338" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8E1338" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLeft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7E1030" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7E1030" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="dotFade" cx="0.3" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#B01E45" opacity="0.5"/>
    </pattern>

    <clipPath id="bannerClip"><rect width="1200" height="360" rx="22"/></clipPath>
    <clipPath id="pillClip"><rect x="64" y="52" width="252" height="30" rx="15"/></clipPath>

    <clipPath id="clipTop">
      <path d="M876 54 C876 112 912 152 943 176 L943 184 L957 184 L957 176 C990 152 1024 112 1024 54 Z"/>
    </clipPath>
    <clipPath id="clipBottom">
      <path d="M876 306 C876 248 912 208 943 184 L957 184 C990 208 1024 248 1024 306 Z"/>
    </clipPath>
    <clipPath id="pileClip">
      <rect x="860" y="306" width="180" height="0">
        <animate attributeName="y" values="306;184;184" keyTimes="0;0.833;1" dur="12s" begin="-6s" repeatCount="indefinite"/>
        <animate attributeName="height" values="0;122;122" keyTimes="0;0.833;1" dur="12s" begin="-6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <mask id="nameMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="360">
      <text x="62" y="148" class="sans" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">DAVID VELEZ</text>
    </mask>

    <mask id="dotsMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="360">
      <rect width="1200" height="360" fill="url(#dotFade)"/>
    </mask>

    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
      .d1{animation-delay:.05s}.d2{animation-delay:.22s}.d3{animation-delay:.42s}.d4{animation-delay:.62s}
      @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      .drift{animation:drift 20s ease-in-out infinite alternate}
      @keyframes drift{to{transform:translate(50px,24px)}}
      .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
      @keyframes ping{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
      @media (prefers-reduced-motion: reduce){
        .rise,.drift,.ping{animation:none!important;opacity:1!important}
      }
    </style>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- fondo -->
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)" mask="url(#dotsMask)" opacity="0.32"/>
    <circle class="drift" cx="240" cy="70" r="200" fill="url(#glowLeft)"/>
    <circle cx="960" cy="190" r="190" fill="url(#haloGrad)"/>

    <!-- columna izquierda -->
    <g class="rise d1">
      <rect x="64" y="52" width="252" height="30" rx="15" fill="#B01E45" fill-opacity="0.1" stroke="#B01E45" stroke-opacity="0.45"/>
      <g clip-path="url(#pillClip)">
        <path fill="url(#pillFill)" opacity="0.75"
              d="M64 72 C84 68 104 76 124 72 C144 68 164 76 184 72 C204 68 224 76 244 72 C264 68 284 76 304 72 L318 72 L318 88 L64 88 Z">
          <animateTransform attributeName="transform" type="translate" values="0 -2.5;0 2.5;0 -2.5" dur="5.5s" repeatCount="indefinite"/>
        </path>
      </g>
      <circle cx="84" cy="67" r="4.5" fill="#E0A64A">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="84" cy="67" r="4.5" fill="none" stroke="#E0A64A" stroke-width="1.4" class="ping"/>
      <text x="98" y="72" class="mono" font-size="13.5" fill="#F6C6D2">open to work · Medellín, CO</text>
    </g>

    <g class="rise d2">
      <g mask="url(#nameMask)">
        <rect x="30" y="82" width="570" height="88" fill="url(#titleGrad)"/>
        <g opacity="0.9">
          <animateTransform attributeName="transform" type="translate" values="-380 0;780 0;780 0" keyTimes="0;0.42;1" dur="7.5s" repeatCount="indefinite"/>
          <rect x="40" y="70" width="120" height="112" fill="url(#shineGrad)" transform="skewX(-22)"/>
        </g>
      </g>
    </g>

    <g class="rise d3">
      <text x="64" y="190" class="sans" font-size="22" font-weight="600" fill="#F8E8ED">ADSO Technologist <tspan fill="#E0608A">·</tspan> Full Stack Developer</text>
      <text x="64" y="220" class="sans" font-size="15" fill="#B58D9B">Backend-first — from data model to interface.</text>
    </g>

    <g class="rise d4 mono">
      <g transform="translate(64 244)">
        <rect width="78" height="30" rx="9" fill="#1B0610" stroke="#5A1230">
          <animate attributeName="stroke" values="#5A1230;#B01E45;#5A1230" dur="7s" begin="0s" repeatCount="indefinite"/>
        </rect>
        <circle cx="14" cy="15" r="3" fill="#E0A64A"/>
        <text x="26" y="20" font-size="12" fill="#F6C6D2">Java</text>
      </g>
      <g transform="translate(152 244)">
        <rect width="86" height="30" rx="9" fill="#1B0610" stroke="#5A1230">
          <animate attributeName="stroke" values="#5A1230;#E0608A;#5A1230" dur="7s" begin="1.2s" repeatCount="indefinite"/>
        </rect>
        <circle cx="14" cy="15" r="3" fill="#E0608A"/>
        <text x="26" y="20" font-size="12" fill="#F6C6D2">React</text>
      </g>
      <g transform="translate(248 244)">
        <rect width="116" height="30" rx="9" fill="#1B0610" stroke="#5A1230">
          <animate attributeName="stroke" values="#5A1230;#C4688A;#5A1230" dur="7s" begin="2.4s" repeatCount="indefinite"/>
        </rect>
        <circle cx="14" cy="15" r="3" fill="#C4688A"/>
        <text x="26" y="20" font-size="12" fill="#F6C6D2">PostgreSQL</text>
      </g>
      <g transform="translate(374 244)">
        <rect width="84" height="30" rx="9" fill="#1B0610" stroke="#5A1230">
          <animate attributeName="stroke" values="#5A1230;#B01E45;#5A1230" dur="7s" begin="3.6s" repeatCount="indefinite"/>
        </rect>
        <circle cx="14" cy="15" r="3" fill="#B01E45"/>
        <text x="26" y="20" font-size="12" fill="#F6C6D2">Docker</text>
      </g>
    </g>

    <!-- reloj de arena -->
    <g class="rise d3">
      <ellipse cx="950" cy="322" rx="96" ry="8" fill="#1A0309" opacity="0.5"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" dur="12s" begin="-6s" repeatCount="indefinite"
                          keyTimes="0;0.9;1" values="0 950 180;0 950 180;180 950 180"/>

        <!-- cristal -->
        <path d="M876 54 C876 112 912 152 943 176 L943 184 C912 208 876 248 876 306 L1024 306 C1024 248 990 208 957 184 L957 176 C990 152 1024 112 1024 54 Z"
              fill="url(#glassFill)" stroke="#B01E45" stroke-opacity="0.6" stroke-width="1.6"/>

        <!-- chorros frontend / backend / database -->
        <g>
          <animate attributeName="opacity" values="0.6;0.6;0;0" keyTimes="0;0.82;0.84;1" dur="12s" begin="-6s" repeatCount="indefinite"/>
          <line x1="946" y1="186" x2="946" y2="300" stroke="#E0608A" stroke-width="1.6" stroke-dasharray="3 6">
            <animate attributeName="stroke-dashoffset" values="0;-18" dur="0.7s" repeatCount="indefinite"/>
          </line>
          <line x1="950" y1="186" x2="950" y2="300" stroke="#E0A64A" stroke-width="1.6" stroke-dasharray="3 6">
            <animate attributeName="stroke-dashoffset" values="0;-18" dur="0.9s" repeatCount="indefinite"/>
          </line>
          <line x1="954" y1="186" x2="954" y2="300" stroke="#F6C6D2" stroke-width="1.6" stroke-dasharray="3 6">
            <animate attributeName="stroke-dashoffset" values="0;-18" dur="0.8s" repeatCount="indefinite"/>
          </line>
        </g>

        <!-- granos -->
        <g>
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.82;0.84;1" dur="12s" begin="-6s" repeatCount="indefinite"/>
          <circle cx="946" r="1.5" fill="#E0608A">
            <animate attributeName="cy" values="187;296" dur="1.9s" begin="0s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.12;0.8;1" dur="1.9s" begin="0s" repeatCount="indefinite"/>
          </circle>
          <circle cx="950" r="1.3" fill="#E0A64A">
            <animate attributeName="cy" values="187;296" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.8;1" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="954" r="1.4" fill="#F6C6D2">
            <animate attributeName="cy" values="187;296" dur="2s" begin="1s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.8;1" dur="2s" begin="1s" repeatCount="indefinite"/>
          </circle>
          <circle cx="946" r="1.2" fill="#E0608A">
            <animate attributeName="cy" values="187;296" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="950" r="1.5" fill="#E0A64A">
            <animate attributeName="cy" values="187;296" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.12;0.8;1" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="954" r="1.2" fill="#F6C6D2">
            <animate attributeName="cy" values="187;296" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.12;0.8;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
          </circle>
        </g>

        <!-- arena acumulada -->
        <g clip-path="url(#clipBottom)">
          <g clip-path="url(#pileClip)">
            <rect x="860" y="184" width="180" height="122" fill="url(#sandGrad)"/>
          </g>
        </g>

        <!-- arena que baja -->
        <g clip-path="url(#clipTop)">
          <g>
            <animateTransform attributeName="transform" type="translate" dur="12s" begin="-6s" repeatCount="indefinite"
                              keyTimes="0;0.833;1" values="0 0;0 130;0 130"/>
            <rect x="860" y="58" width="180" height="118" fill="url(#sandGrad)"/>
          </g>
        </g>

        <!-- reflejo del cristal -->
        <path d="M884 70 C884 108 906 142 926 164" fill="none" stroke="#FFE7ED" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round"/>

        <!-- tapas -->
        <rect x="866" y="42" width="168" height="11" rx="5.5" fill="#3A0A1C" stroke="#5A1230" stroke-width="1.2"/>
        <rect x="872" y="44" width="156" height="1.6" rx="0.8" fill="#E0608A" opacity="0.35"/>
        <rect x="866" y="307" width="168" height="11" rx="5.5" fill="#3A0A1C" stroke="#5A1230" stroke-width="1.2"/>
        <rect x="872" y="309" width="156" height="1.6" rx="0.8" fill="#E0608A" opacity="0.2"/>
      </g>
    </g>

    <!-- leyenda frontend / backend / database -->
    <g class="mono" font-size="8.5" letter-spacing="1.2" fill="#B58D9B">
      <circle cx="834" cy="338" r="3" fill="#E0608A"/>
      <text x="846" y="341">FRONTEND</text>
      <circle cx="922" cy="338" r="3" fill="#E0A64A"/>
      <text x="934" y="341">BACKEND</text>
      <circle cx="1004" cy="338" r="3" fill="#F6C6D2"/>
      <text x="1016" y="341">DATABASE</text>
    </g>

    <!-- borde -->
    <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="22" fill="none" stroke="#5A1230" stroke-opacity="0.9" stroke-width="1.5"/>
    <rect width="1200" height="1.2" fill="#FFFFFF" opacity="0.06"/>
  </g>
</svg>
