<svg xmlns="http://www.w3.org/2000/svg" width="600" height="218" viewBox="0 0 600 218" role="img" aria-label="PPTMaps — FastAPI · PostGIS · WebSockets">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#05070B"/>
      <stop offset="0.5" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>

    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.12">
      <stop offset="0" stop-color="#6C7888"/>
      <stop offset="0.14" stop-color="#DCE5EF"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.44" stop-color="#AFBCCB"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#C6D1DE"/>
      <stop offset="0.86" stop-color="#8D99A9"/>
      <stop offset="1" stop-color="#E4EBF4"/>
    </linearGradient>

    <linearGradient id="chromeSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B98A8"/>
      <stop offset="0.5" stop-color="#EDF3FA"/>
      <stop offset="1" stop-color="#9AA6B6"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47535F"/>
      <stop offset="0.22" stop-color="#C8D3E0"/>
      <stop offset="0.45" stop-color="#39434F"/>
      <stop offset="0.68" stop-color="#E9EFF7"/>
      <stop offset="0.88" stop-color="#4A5663"/>
      <stop offset="1" stop-color="#8A96A6"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#C9A968" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#FFF3D6"/>
      <stop offset="0.8" stop-color="#E3C98F" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6B2F"/>
      <stop offset="0.5" stop-color="#E3C98F"/>
      <stop offset="1" stop-color="#8A6B2F"/>
    </linearGradient>

    <linearGradient id="goldRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E3C98F"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyanRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79D2FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79D2FF"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.012"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.028"/>
    </linearGradient>

    <linearGradient id="shineTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#79D2FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#79D2FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3C98F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E3C98F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="screw" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#F4F8FD"/>
      <stop offset="0.55" stop-color="#8D99A9"/>
      <stop offset="1" stop-color="#2A3340"/>
    </radialGradient>

    <pattern id="brush" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 1.5H7" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="0.7"/>
      <path d="M0 4.5H7" stroke="#FFFFFF" stroke-opacity="0.018" stroke-width="0.7"/>
    </pattern>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8FA4BC" stroke-opacity="0.07"/>
    </pattern>

    <style>
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .pulse-slow { animation: pulse 5s ease-in-out infinite; }
      .flow { stroke-dasharray: 5 11; animation: flow 3s linear infinite; }
      .blink { animation: blink 1.5s steps(1) infinite; }
      .sweep { animation: sweep 9s cubic-bezier(.45,0,.25,1) infinite; }
      .sweep-slow { animation: sweep 12s cubic-bezier(.45,0,.25,1) infinite; }
      .gold-run { animation-name: goldrun; animation-timing-function: linear; animation-iteration-count: infinite; animation-duration: 6s; }
      .gold-halo { animation: goldpulse 3.4s ease-in-out infinite; }
      .gold-breathe { animation: goldbreathe 3s ease-in-out infinite; }
      .trail-sweep { animation: trailsweep 8s linear infinite; }
      .s1 { animation-delay: .5s; } .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 1.7s; }
      .s4 { animation-delay: 2.3s; } .s5 { animation-delay: 2.9s; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes sweep { 0%, 62% { transform: translateX(-520px); } 92%, 100% { transform: translateX(1320px); } }
      @keyframes goldrun { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
      @keyframes goldpulse { 0%, 100% { opacity: .12; } 50% { opacity: .55; } }
      @keyframes goldbreathe { 0%, 100% { opacity: .22; } 50% { opacity: 1; } }
      @keyframes trailsweep { 0% { transform: translateX(-170px); } 100% { transform: translateX(900px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <clipPath id="clip"><rect width="600" height="218" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    
  <rect width="600" height="218" rx="20" fill="url(#bg)"/>
  <rect width="600" height="218" rx="20" fill="url(#brush)"/>
  <rect width="600" height="218" rx="20" fill="url(#grid)"/>
  <rect x="0.6" y="0.6" width="598.8" height="216.8" rx="19.4"
        fill="none" stroke="url(#edge)" stroke-opacity="0.5" stroke-width="1"/>
  <rect x="6" y="6" width="588" height="206" rx="15"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
  
  <rect x="3.25" y="3.25" width="593.5" height="211.5" rx="16.75" fill="none" stroke="url(#goldEdge)" stroke-opacity="0.5" stroke-width="0.9"/>
  <rect class="gold-breathe" x="3.25" y="3.25" width="593.5" height="211.5" rx="16.75" fill="none" stroke="#E3C98F" stroke-width="1"/>
  <rect class="gold-halo" x="3.25" y="3.25" width="593.5" height="211.5" rx="16.75" fill="none" stroke="#E3C98F" stroke-width="6" stroke-opacity="0.22"/>
  <rect class="gold-run" x="3.25" y="3.25" width="593.5" height="211.5" rx="16.75" fill="none" pathLength="100" stroke="#F4DFAC" stroke-width="4.2" stroke-opacity="0.14" stroke-dasharray="30 70" style="animation-duration:9s"/>
  <rect class="gold-run" x="3.25" y="3.25" width="593.5" height="211.5" rx="16.75" fill="none" pathLength="100" stroke="#EBD29B" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="30 70" style="animation-duration:9s"/>
  <rect class="gold-run" x="3.25" y="3.25" width="593.5" height="211.5" rx="16.75" fill="none" pathLength="100" stroke="#FFF8E6" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 96" style="animation-duration:9s;animation-delay:-3.60s"/>
  <rect class="gold-run" x="3.25" y="3.25" width="593.5" height="211.5" rx="16.75" fill="none" pathLength="100" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="1 99" style="animation-duration:9s;animation-delay:-6.30s"/>
  <circle cx="18" cy="18" r="6.5" fill="none" stroke="#E3C98F" stroke-width="1" stroke-opacity="0.5" class="pulse"/>
  <circle cx="582" cy="18" r="6.5" fill="none" stroke="#E3C98F" stroke-width="1" stroke-opacity="0.5" class="pulse s2"/>
  <circle cx="18" cy="200" r="6.5" fill="none" stroke="#E3C98F" stroke-width="1" stroke-opacity="0.5" class="pulse s3"/>
  <circle cx="582" cy="200" r="6.5" fill="none" stroke="#E3C98F" stroke-width="1" stroke-opacity="0.5" class="pulse s4"/>
  <circle cx="18" cy="18" r="3.6" fill="url(#screw)" opacity="0.8"/>
  <circle cx="582" cy="18" r="3.6" fill="url(#screw)" opacity="0.8"/>
  <circle cx="18" cy="200" r="3.6" fill="url(#screw)" opacity="0.8"/>
  <circle cx="582" cy="200" r="3.6" fill="url(#screw)" opacity="0.8"/>
    <ellipse cx="560" cy="20" rx="190" ry="130" fill="url(#glowGold)" opacity="0.5"/>

    <text class="mono" x="28" y="38" font-size="9.5" letter-spacing="2.8" fill="#E3C98F">PROYECTO 02</text>
    <g transform="translate(536 22)">
      <circle cx="12" cy="12" r="12" fill="#0D131A" stroke="#27313D" stroke-opacity="0.9"/>
      <text class="mono" x="12" y="17" text-anchor="middle" font-size="12" fill="#C3CEDA">↗</text>
    </g>

    <text class="sans" x="24" y="82" font-size="30" font-weight="800" letter-spacing="-0.9" fill="url(#chromeSoft)">PPTMaps</text>
    <text class="sans" x="28" y="112" font-size="12.5" fill="#A9B6C6">Inteligencia geoespacial y alertas de movilidad en tiempo real.</text>
    <text class="sans" x="28" y="132" font-size="11.5" fill="#6E7C8D">FastAPI · PostGIS · WebSockets</text>

    <g transform="translate(28 146)">
      <rect width="108" height="22" rx="11" fill="#0E141C" stroke="#4A3E26" stroke-opacity="0.9"/>
      <text class="mono" x="54" y="14.7" text-anchor="middle" font-size="9.5" fill="#C3CEDA">Redis + Celery</text>
    </g><g transform="translate(143 146)">
      <rect width="61" height="22" rx="11" fill="#0E141C" stroke="#4A3E26" stroke-opacity="0.9"/>
      <text class="mono" x="30.5" y="14.7" text-anchor="middle" font-size="9.5" fill="#C3CEDA">DBSCAN</text>
    </g><g transform="translate(211 146)">
      <rect width="67" height="22" rx="11" fill="#0E141C" stroke="#4A3E26" stroke-opacity="0.9"/>
      <text class="mono" x="33.5" y="14.7" text-anchor="middle" font-size="9.5" fill="#C3CEDA">Leaflet</text>
    </g>

    <line x1="28" y1="184" x2="572" y2="184" stroke="#1B232D"/>
    <circle cx="32" cy="200" r="3.2" fill="#E3C98F"/>
    <text class="mono" x="44" y="203.5" font-size="9.5" fill="#C3CEDA">702.540 incidentes · 15 estaciones</text>

    
  <g clip-path="url(#clip)" transform="rotate(-16 300 109)">
    <rect class="sweep" x="-300" y="-160" width="230" height="558" fill="url(#sheen)"/>
  </g>
  </g>
</svg>
