<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Journey: foundation, build, ship and next steps">
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E0710"/>
      <stop offset="0.55" stop-color="#19050C"/>
      <stop offset="1" stop-color="#120409"/>
    </linearGradient>
    <linearGradient id="jline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0608A" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#E0608A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E0A64A" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="jglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B01E45" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B01E45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="jgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#5A1230" stroke-width="0.6" opacity="0.18"/>
    </pattern>
    <clipPath id="jClip">
      <rect x="20" y="20" width="1160" height="360" rx="18"/>
    </clipPath>
    <style>
      .ui { font-family: 'Inter','Segoe UI',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace; }
      .tag { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; font-size: 10.5px; fill: #F6C6D2; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#jClip)">
    <rect x="20" y="20" width="1160" height="360" fill="url(#jbg)"/>
    <rect x="20" y="20" width="1160" height="360" fill="url(#jgrid)"/>
    <circle cx="1060" cy="90" r="180" fill="url(#jglow)"/>

    <rect x="20" y="20" width="1160" height="44" fill="#220710" opacity="0.7"/>
    <rect x="20" y="64" width="1160" height="1" fill="#5A1230"/>

    <rect x="40" y="32" width="58" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
    <path d="M50 47v-6a3 3 0 013-3h4M54 35l-3 3 3 3" fill="none" stroke="#E0608A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="46" class="mono" font-size="9.5" fill="#F6C6D2">main</text>
    <text x="112" y="46" class="mono" font-size="10.5" fill="#A86C80">git log --graph --oneline --all</text>
    <rect x="336" y="35" width="2" height="12" fill="#E0608A" class="cursor"/>
    <text x="1140" y="46" class="mono" font-size="9.5" fill="#8A5566" text-anchor="end">4 milestones</text>

    <line x1="70" y1="88" x2="70" y2="332" stroke="url(#jline)" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#E0608A" opacity="0.9">
      <animateMotion dur="8s" repeatCount="indefinite" path="M70 88 L70 332"/>
    </circle>

    <g>
      <circle cx="70" cy="106" r="18" fill="url(#jglow)" opacity="0.65"/>
      <circle cx="70" cy="106" r="11" fill="#1E0710" stroke="#5A1230"/>
      <circle cx="70" cy="106" r="5" fill="#E0608A"/>
      <line x1="81" y1="106" x2="96" y2="106" stroke="#5A1230"/>
      <text x="102" y="110" class="mono" font-size="9.5" fill="#A86C80">HEAD~3</text>
      <text x="190" y="110" class="ui" font-size="18" font-weight="700" fill="#F8E8ED"><tspan fill="#E0608A">01</tspan> · Foundation</text>
      <text x="190" y="132" class="ui" font-size="14" fill="#DBAEBE">ADSO Technologist @ SENA · 6th semester. Software analysis, databases and architecture.</text>
      <rect x="880" y="96" width="54" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="907" y="110" class="tag" text-anchor="middle">SENA</text>
      <rect x="942" y="96" width="54" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="969" y="110" class="tag" text-anchor="middle">ADSO</text>
      <rect x="1004" y="96" width="96" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="1052" y="110" class="tag" text-anchor="middle">6th semester</text>
    </g>

    <g>
      <circle cx="70" cy="172" r="11" fill="#1E0710" stroke="#5A1230"/>
      <circle cx="70" cy="172" r="5" fill="#B01E45"/>
      <line x1="81" y1="172" x2="96" y2="172" stroke="#5A1230"/>
      <text x="102" y="176" class="mono" font-size="9.5" fill="#A86C80">HEAD~2</text>
      <text x="190" y="176" class="ui" font-size="18" font-weight="700" fill="#F8E8ED"><tspan fill="#E0608A">02</tspan> · Build</text>
      <text x="190" y="198" class="ui" font-size="14" fill="#DBAEBE">Four featured projects: e-commerce, urban mobility, tower defense and food catalog.</text>
      <rect x="880" y="162" width="76" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="918" y="176" class="tag" text-anchor="middle">4 projects</text>
      <rect x="964" y="162" width="78" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="1003" y="176" class="tag" text-anchor="middle">Full stack</text>
      <rect x="1050" y="162" width="82" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="1091" y="176" class="tag" text-anchor="middle">AI workflow</text>
    </g>

    <g>
      <circle cx="70" cy="238" r="11" fill="#1E0710" stroke="#5A1230"/>
      <circle cx="70" cy="238" r="5" fill="#E0608A"/>
      <line x1="81" y1="238" x2="96" y2="238" stroke="#5A1230"/>
      <text x="102" y="242" class="mono" font-size="9.5" fill="#A86C80">HEAD~1</text>
      <text x="190" y="242" class="ui" font-size="18" font-weight="700" fill="#F8E8ED"><tspan fill="#E0608A">03</tspan> · Ship</text>
      <text x="190" y="264" class="ui" font-size="14" fill="#DBAEBE">Docker, Kubernetes and GitHub Actions. Reproducible environments and CI/CD.</text>
      <rect x="880" y="228" width="58" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="909" y="242" class="tag" text-anchor="middle">Docker</text>
      <rect x="946" y="228" width="44" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="968" y="242" class="tag" text-anchor="middle">K8s</text>
      <rect x="998" y="228" width="54" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="1025" y="242" class="tag" text-anchor="middle">CI/CD</text>
    </g>

    <g>
      <circle cx="70" cy="304" r="20" fill="#E0A64A" opacity="0.10" class="pulse"/>
      <circle cx="70" cy="304" r="12" fill="#1E0710" stroke="#E0A64A" stroke-opacity="0.65"/>
      <circle cx="70" cy="304" r="5" fill="#E0A64A"/>
      <line x1="82" y1="304" x2="96" y2="304" stroke="#5A1230"/>
      <text x="102" y="308" class="mono" font-size="9.5" fill="#E0A64A">HEAD</text>
      <text x="190" y="308" class="ui" font-size="18" font-weight="700" fill="#F8E8ED"><tspan fill="#E0A64A">04</tspan> · Next</text>
      <text x="190" y="330" class="ui" font-size="14" fill="#DBAEBE">Open to internships and junior full-stack roles. Ready to contribute from day one.</text>
      <rect x="880" y="294" width="82" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="921" y="308" class="tag" text-anchor="middle">Internships</text>
      <rect x="970" y="294" width="84" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="1012" y="308" class="tag" text-anchor="middle">Junior roles</text>
      <rect x="1062" y="294" width="66" height="20" rx="10" fill="#3B0E1E" stroke="#5A1230"/>
      <text x="1095" y="308" class="tag" text-anchor="middle">Medellín</text>
    </g>
  </g>

  <rect x="20" y="20" width="1160" height="360" rx="18" fill="none" stroke="#5A1230" stroke-width="1.5"/>
</svg>
